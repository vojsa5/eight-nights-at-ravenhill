<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
  <title>Séance</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="80%">
      <stop offset="0" stop-color="#3c2a52"/>
      <stop offset="1" stop-color="#07050b"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".85"/>
    </radialGradient>
    <radialGradient id="orb" cx="42%" cy="38%" r="65%">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset=".45" stop-color="#a8c8e8"/>
      <stop offset="1" stop-color="#3a4a78"/>
    </radialGradient>
    <filter id="halo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <radialGradient id="lamps" cx="50%" cy="60%" r="80%">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffb870" stop-opacity=".2"/>
    </radialGradient>
  </defs>
  <style>
    /* its life on the night's opening card (intro.js inlines it as .ev-live): the lamps are dimmed, the crystal wakes
       and its mist rises, the planchette wanders to a letter, and something knocks three times */
    .ev-live .se-lamps { animation: se-dim .9s calc(var(--dawn, 0ms) - 100ms) ease-in-out both; }
    .ev-live .se-aura { animation: se-on 1.2s calc(var(--dawn, 0ms) + 400ms) ease-out both; }
    .ev-live .se-mist { transform-origin: 180px 112px; animation: se-rise 1.5s calc(var(--dawn, 0ms) + 450ms) ease-out both; }
    .ev-live .se-sway { transform-origin: 180px 112px; animation: se-sway 3s calc(var(--dawn, 0ms) + 1900ms) ease-in-out 6 alternate; }
    .ev-live .se-planchette { animation: se-glide 1.4s calc(var(--dawn, 0ms) + 250ms) ease-in-out both; }
    .ev-live .se-tile { animation: se-tile 1.1s calc(var(--dawn, 0ms) + 1550ms) ease-out both; }
    .ev-live .se-table { animation: se-knock .78s calc(var(--dawn, 0ms) + 1300ms) linear both; }
    .ev-live .se-ripple { transform-origin: 180px 148px; animation: se-ripple .26s calc(var(--dawn, 0ms) + 1300ms) ease-out 3 both; }
    .ev-live .se-flame { transform-box: fill-box; transform-origin: 50% 100%; animation: se-flicker 1.4s ease-in-out 10 alternate; }
    .ev-live .se-flame.b { animation-duration: 1.1s; animation-delay: -.5s; }
    @keyframes se-dim { from { opacity: 1; } to { opacity: 0; } }
    @keyframes se-on { from { opacity: 0; } }
    @keyframes se-rise { from { opacity: 0; transform: translateY(20px) scaleY(.5); } }
    @keyframes se-sway { from { transform: none; } to { transform: skewX(-6deg); } }
    @keyframes se-glide { 0% { transform: translate(140px, 160px) rotate(24deg); } 40% { transform: translate(190px, 167px) rotate(-6deg); }
      60% { transform: translate(198px, 165px) rotate(-2deg); } 100% { transform: translate(224px, 158px) rotate(0deg); } }
    @keyframes se-tile { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes se-knock { 0%, 10%, 33%, 43%, 66%, 76%, 100% { transform: none; } 3%, 36%, 69% { transform: translateY(2px); } }
    @keyframes se-ripple { from { opacity: .9; transform: scale(.5); } to { opacity: 0; transform: scale(3.2); } }
    @keyframes se-flicker { 0% { transform: none; } 35% { transform: scale(.93, 1.07) skewX(3deg); } 70% { transform: scale(1.05, .94) skewX(-2deg); } 100% { transform: scale(.97, 1.04); } }
  </style>
