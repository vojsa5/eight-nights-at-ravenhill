<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
  <title>Notebook</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#5a4020"/>
      <stop offset="1" stop-color="#0b0703"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".85"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6b0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffe6b0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    /* its life on the night's opening card (intro.js inlines it as .ev-live): the lamp flickers on, a draught turns the
       page over to the last thing written, the red line is drawn and the reading glass comes to rest over it */
    .ev-live .nb-beam { animation: nb-lamp .9s calc(var(--dawn, 0ms) - 100ms) linear both; }
    .ev-live .nb-leaf { transform-origin: 176px 161px; animation: nb-turn 1s calc(var(--dawn, 0ms) + 250ms) cubic-bezier(.45,.05,.4,1) both; }
    .ev-live .nb-red { stroke-dasharray: 1; animation: nb-draw .45s calc(var(--dawn, 0ms) + 1150ms) ease-out both; }
    .ev-live .nb-glass { animation: nb-glass 1.3s calc(var(--dawn, 0ms) + 100ms) cubic-bezier(.2,.7,.3,1) both; }
    @keyframes nb-lamp { 0% { opacity: 0; } 12% { opacity: .9; } 18% { opacity: .15; } 30% { opacity: 1; } 36% { opacity: .45; } 46%, 100% { opacity: 1; } }
    @keyframes nb-turn { 0% { opacity: 1; transform: scaleX(1) skewY(0deg); fill: #f6eedb; } 48% { transform: scaleX(.04) skewY(-9deg); fill: #fffaf0; }
      52% { transform: scaleX(-.04) skewY(-9deg); fill: #e2d6b8; } 88% { opacity: 1; transform: scaleX(-1) skewY(0deg); fill: #efe4cc; }
      100% { opacity: 0; transform: scaleX(-1) skewY(0deg); fill: #efe4cc; } }
    @keyframes nb-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes nb-glass { from { transform: translate(34px, -22px) rotate(8deg); opacity: 0; } 30% { opacity: 1; } to { transform: none; opacity: 1; } }
  </style>
  <rect width="360" height="200" fill="url(#bg)"/>
  <path class="nb-beam" d="M40 0 L120 0 L250 200 L-40 200Z" fill="url(#beam)"/>
  <path d="M60 0 L96 0 L92 18 L64 18Z" fill="#2a3a2a" stroke="#8a6a2a"/>
  <rect x="0" y="150" width="360" height="50" fill="#2a1a0e"/>
  <path d="M80 150 L176 138 L176 184 L84 192Z" fill="#f4ecd8"/>
  <path d="M176 138 L272 150 L268 192 L176 184Z" fill="#efe4cc"/>
  <path d="M176 138 L176 184" stroke="#b8a888" stroke-width="1.5"/>
  <path d="M92 156 q10 -3 20 0 t20 0 t20 0 t18 0" fill="none" stroke="#5a4a38" stroke-width="1.2" transform="rotate(-4 130 156)"/>
  <path d="M92 163 q10 -3 20 0 t20 0 t20 0 t18 0" fill="none" stroke="#5a4a38" stroke-width="1.2" transform="rotate(-4 130 163)"/>
  <path d="M92 170 q10 -3 20 0 t20 0 t20 0 t18 0" fill="none" stroke="#5a4a38" stroke-width="1.2" transform="rotate(-4 130 170)"/>
  <path d="M92 177 q10 -3 20 0 t20 0 t20 0 t18 0" fill="none" stroke="#5a4a38" stroke-width="1.2" transform="rotate(-4 130 177)"/>
  <path class="nb-red" d="M190 150 L254 158" stroke="#b3221b" stroke-width="1.5" pathLength="1"/>
  <text x="222" y="170" font-size="11" font-family="Georgia" fill="#5a4a38" text-anchor="middle">looks guilty?</text>
  <path class="nb-leaf" d="M176 138 L272 150 L268 192 L176 184Z" fill="#f6eedb" stroke="#b8a888" stroke-width=".6" opacity="0"/>
  <g class="nb-glass">
    <circle cx="232" cy="118" r="24" fill="#bcd6ff" fill-opacity=".3" stroke="#e6c783" stroke-width="5" filter="url(#glow)"/>
    <line x1="250" y1="134" x2="284" y2="160" stroke="#3a2a1a" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g transform="rotate(12 120 180)">
    <rect x="100" y="176" width="60" height="5" fill="#e6b450"/>
    <path d="M160 176 L168 178.5 L160 181Z" fill="#3a2a1a"/>
  </g>
  <rect x="300" y="126" width="22" height="26" rx="3" fill="#10131a" stroke="#6a7f96"/>
  <rect width="360" height="200" fill="url(#vig)"/>
</svg>
