<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 262" width="200" height="262">
  <title>Miss Ives, violinist</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0" stop-color="#6e5c44"/>
      <stop offset="1" stop-color="#0e0b07"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="72%">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".8"/>
    </radialGradient>
    <filter id="halo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 .9  0 0 0 0 .8  0 0 0 0 .6  0 0 0 .07 0"/>
    </filter>
  </defs>
  <rect width="200" height="262" fill="url(#bg)"/>
  <path d="M30 60 q4 -8 8 0" fill="none" stroke="#efe2c0" stroke-opacity=".3" stroke-width="1.5"/>
  <path d="M40 90 q4 -8 8 0" fill="none" stroke="#efe2c0" stroke-opacity=".3" stroke-width="1.5"/>
  <path d="M160 70 q4 -8 8 0" fill="none" stroke="#efe2c0" stroke-opacity=".3" stroke-width="1.5"/>
  <path d="M170 40 q4 -8 8 0" fill="none" stroke="#efe2c0" stroke-opacity=".3" stroke-width="1.5"/>
  <path d="M24 130 q4 -8 8 0" fill="none" stroke="#efe2c0" stroke-opacity=".3" stroke-width="1.5"/>
  <g fill="#ead9b6" opacity=".55" filter="url(#halo)">
    <path d="M14 262 C18 204 52 176 100 172 C148 176 182 204 186 262 Z"/>
    <path d="M86 136 L86 180 L114 180 L114 136 Z"/>
    <ellipse cx="100" cy="108" rx="27" ry="33"/>
    <circle cx="100" cy="72" r="16"/>
  </g>
  <g fill="#0d0a08">
    <path d="M14 262 C18 204 52 176 100 172 C148 176 182 204 186 262 Z"/>
    <path d="M86 136 L86 180 L114 180 L114 136 Z"/>
    <ellipse cx="100" cy="108" rx="27" ry="33"/>
    <circle cx="100" cy="72" r="16"/>
  </g>
  <path d="M86 74 Q92 64 98 72" fill="none" stroke="#efe2c0" stroke-width="2.5"/>
  <g transform="rotate(-38 130 196)">
    <ellipse cx="130" cy="210" rx="16" ry="12" fill="#7a4a2a" stroke="#c9a45c" stroke-width="1.5"/>
    <ellipse cx="130" cy="188" rx="12" ry="10" fill="#7a4a2a" stroke="#c9a45c" stroke-width="1.5"/>
    <rect x="127" y="150" width="6" height="34" fill="#3a2414"/>
  </g>
  <line x1="70" y1="160" x2="176" y2="236" stroke="#efe2c0" stroke-width="2" filter="url(#glow)"/>
  <rect width="200" height="262" filter="url(#grain)"/>
  <rect width="200" height="262" fill="url(#vig)"/>
  <rect x="5" y="5" width="190" height="252" rx="3" fill="none" stroke="#efe2c0" stroke-opacity=".25"/>
</svg>
