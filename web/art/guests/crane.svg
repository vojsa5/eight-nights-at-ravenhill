<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 262" width="200" height="262">
  <title>Dr Crane, surgeon</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0" stop-color="#6e5c44"/>
      <stop offset="1" stop-color="#0e0b07"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="72%">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".8"/>
    </radialGradient>
    <filter id="halo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 .9  0 0 0 0 .8  0 0 0 0 .6  0 0 0 .07 0"/>
    </filter>
  </defs>
  <rect width="200" height="262" fill="url(#bg)"/>
  <g fill="#ead9b6" opacity=".55" filter="url(#halo)">
    <path d="M14 262 C18 204 52 176 100 172 C148 176 182 204 186 262 Z"/>
    <path d="M86 136 L86 180 L114 180 L114 136 Z"/>
    <ellipse cx="100" cy="108" rx="27" ry="33"/>
  </g>
  <g fill="#0d0a08">
    <path d="M14 262 C18 204 52 176 100 172 C148 176 182 204 186 262 Z"/>
    <path d="M86 136 L86 180 L114 180 L114 136 Z"/>
    <ellipse cx="100" cy="108" rx="27" ry="33"/>
  </g>
  <path d="M73 94 Q100 84 127 94" fill="none" stroke="#efe2c0" stroke-width="3"/>
  <circle cx="100" cy="86" r="9" fill="#dfe8f0" stroke="#d9b870" stroke-width="2" filter="url(#glow)"/>
  <path d="M80 172 C74 200 90 214 100 214 C110 214 126 200 120 172" fill="none" stroke="#efe2c0" stroke-width="3"/>
  <line x1="100" y1="214" x2="100" y2="228" stroke="#efe2c0" stroke-width="3"/>
  <circle cx="100" cy="232" r="6" fill="#efe2c0" filter="url(#glow)"/>
  <rect width="200" height="262" filter="url(#grain)"/>
  <rect width="200" height="262" fill="url(#vig)"/>
  <rect x="5" y="5" width="190" height="252" rx="3" fill="none" stroke="#efe2c0" stroke-opacity=".25"/>
</svg>
