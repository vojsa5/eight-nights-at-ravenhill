<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 262" width="200" height="262">
  <title>Dr Lowe, chemist</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0" stop-color="#6e5c44"/>
      <stop offset="1" stop-color="#0e0b07"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="72%">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".8"/>
    </radialGradient>
    <filter id="halo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 .9  0 0 0 0 .8  0 0 0 0 .6  0 0 0 .07 0"/>
    </filter>
  </defs>
  <rect width="200" height="262" fill="url(#bg)"/>
  <g fill="#ead9b6" opacity=".55" filter="url(#halo)">
    <path d="M14 262 C18 204 52 176 100 172 C148 176 182 204 186 262 Z"/>
    <path d="M86 136 L86 180 L114 180 L114 136 Z"/>
    <ellipse cx="100" cy="108" rx="27" ry="33"/>
  </g>
  <g fill="#0d0a08">
    <path d="M14 262 C18 204 52 176 100 172 C148 176 182 204 186 262 Z"/>
    <path d="M86 136 L86 180 L114 180 L114 136 Z"/>
    <ellipse cx="100" cy="108" rx="27" ry="33"/>
  </g>
  <path d="M73 96 Q100 88 127 96" stroke="#3a2a1a" stroke-width="4" fill="none"/>
  <circle cx="88" cy="92" r="8" fill="#bcd6ff" fill-opacity=".35" stroke="#d9b870" stroke-width="2" filter="url(#glow)"/>
  <circle cx="112" cy="92" r="8" fill="#bcd6ff" fill-opacity=".35" stroke="#d9b870" stroke-width="2" filter="url(#glow)"/>
  <rect x="134" y="156" width="10" height="22" fill="#dfe8f0" fill-opacity=".4" stroke="#dfe8f0"/>
  <circle cx="139" cy="196" r="20" fill="#dfe8f0" fill-opacity=".25" stroke="#dfe8f0" stroke-width="1.5"/>
  <path d="M121 200 A18 18 0 0 0 157 200Z" fill="#e0a040" filter="url(#glow)"/>
  <circle cx="136" cy="192" r="2" fill="none" stroke="#efe2c0"/>
  <circle cx="142" cy="186" r="2" fill="none" stroke="#efe2c0"/>
  <circle cx="139" cy="150" r="2" fill="none" stroke="#efe2c0"/>
  <circle cx="145" cy="140" r="2" fill="none" stroke="#efe2c0"/>
  <rect width="200" height="262" filter="url(#grain)"/>
  <rect width="200" height="262" fill="url(#vig)"/>
  <rect x="5" y="5" width="190" height="252" rx="3" fill="none" stroke="#efe2c0" stroke-opacity=".25"/>
