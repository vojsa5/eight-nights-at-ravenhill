  <path d="M189 132.4 L126 144.3 L104 146 L124.8 138.5 L187 123.6Z" fill="#9aa0ae"/>
  <path d="M189 132.4 L126 144.3 L104 146" fill="none" stroke="#dde4f0" stroke-width="1"/>
  <g stroke-linecap="round">
    <path d="M188 128 L210 132.4" stroke="#8a8e9a" stroke-width="7"/>
    <path d="M210 132.4 L276 146" stroke="#7a4a24" stroke-width="8"/>
    <path d="M214 130 L272 142" stroke="#b88048" stroke-width="1.4" opacity=".8"/>
  </g>
  <path d="M189 123.6 L122 111.8 L98 110 L120.7 117.6 L187 132.4Z" fill="#b4bac8"/>
  <path d="M189 123.6 L122 111.8 L98 110" fill="none" stroke="#eef4fc" stroke-width="1.2" filter="url(#glow)"/>
  <circle cx="188" cy="128" r="4" fill="#5a5e68" stroke="#c8ccd8" stroke-width="1.2"/>
  <!-- the snipped telephone wire tangled in the blades -->
  <g fill="none" stroke="#0a0908" stroke-width="2.4" stroke-linecap="round">
    <path d="M82 184 C84 168 80 156 92 148 C104 140 118 150 124 140 C130 128 110 118 118 112 C126 106 138 124 144 132 C150 140 158 136 152 126 C148 118 158 116 168 126"/>
    <path d="M174 130 C184 138 196 142 206 138 C216 134 210 126 222 124 C232 122 236 132 246 128"/>
  </g>
  <g fill="none" stroke="#6a6a72" stroke-width=".8" stroke-dasharray="1.5 2.5">
    <path d="M92 148 C104 140 118 150 124 140 C130 128 110 118 118 112 C126 106 138 124 144 132"/>
    <path d="M206 138 C216 134 210 126 222 124 C232 122 236 132 246 128"/>
