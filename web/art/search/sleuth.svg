<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
  <title>An open pocketbook of neat entries, each one ticked or crossed, with a magnifying glass lying across it and a pencil beside it under the lamp</title>
  <defs>
    <radialGradient id="bg" cx="35%" cy="40%" r="80%">
      <stop offset="0" stop-color="#40321e"/>
      <stop offset="1" stop-color="#060504"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="52%" r="75%">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".85"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffcf80" stop-opacity=".32"/>
      <stop offset="1" stop-color="#ffcf80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gutter" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset=".5" stop-color="#000" stop-opacity=".4"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="224" cy="120" r="19"/></clipPath>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <g id="rows">
      <path d="M190 108 L220 108 M190 116 L214 116 M190 124 L222 124 M190 132 L212 132 M190 140 L218 140 M190 148 L210 148 M190 156 L216 156" stroke="#5a4c3c" stroke-width=".9"/>
      <path d="M229 107 l2.5 3 l5 -6.5 M229 115 l2.5 3 l5 -6.5 M229 139 l2.5 3 l5 -6.5 M229 155 l2.5 3 l5 -6.5" fill="none" stroke="#24324e" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M229 120 l5.5 5.5 M234.5 120 l-5.5 5.5 M229 128 l5.5 5.5 M234.5 128 l-5.5 5.5 M229 144 l5.5 5.5 M234.5 144 l-5.5 5.5" stroke="#9e1b1b" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="360" height="200" fill="url(#bg)"/>
  <!-- the lamp -->
  <circle cx="70" cy="70" r="34" fill="#ffcf80" opacity=".16" filter="url(#soft)"/>
  <rect x="68" y="58" width="4" height="40" fill="#8a6a30"/>
  <path d="M44 58 Q70 38 96 58 L92 62 L48 62Z" fill="#2f5a2e"/>
  <path d="M50 52 Q70 42 90 52" fill="none" stroke="#5a8a50" stroke-width="1" opacity=".6"/>
  <ellipse cx="70" cy="62" rx="20" ry="2" fill="#ffe2a0" filter="url(#glow)"/>
  <!-- desk -->
  <rect x="0" y="96" width="360" height="104" fill="#1a1109"/>
  <rect x="0" y="96" width="360" height="2" fill="#2e1e10"/>
  <ellipse cx="70" cy="99" rx="18" ry="4" fill="#5a4222"/>
  <ellipse cx="178" cy="134" rx="160" ry="58" fill="url(#pool)"/>
  <!-- the pocketbook -->
  <g transform="rotate(-4 180 128)">
    <rect x="110" y="94" width="150" height="82" rx="4" fill="#000" opacity=".45" filter="url(#soft)"/>
    <rect x="104" y="86" width="152" height="84" rx="4" fill="#3a1a10"/>
    <rect x="110" y="90" width="68" height="76" fill="#ebdfc2"/>
    <rect x="182" y="90" width="68" height="76" fill="#e2d5b6"/>
    <rect x="168" y="90" width="24" height="76" fill="url(#gutter)"/>
    <path d="M118 96 L146 96 M190 96 L210 96" stroke="#3a3040" stroke-width="1.6"/>
    <path d="M116 100.5 L172 100.5 M188 100.5 L244 100.5" stroke="#8a7658" stroke-width=".6"/>
    <path d="M118 108 L152 108 M118 116 L146 116 M118 124 L154 124 M118 132 L148 132 M118 140 L152 140 M118 148 L144 148 M118 156 L150 156" stroke="#5a4c3c" stroke-width=".9"/>
    <path d="M160 107 l2.5 3 l5 -6.5 M160 115 l2.5 3 l5 -6.5 M160 131 l2.5 3 l5 -6.5 M160 147 l2.5 3 l5 -6.5 M160 155 l2.5 3 l5 -6.5" fill="none" stroke="#24324e" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M160 120 l5.5 5.5 M165.5 120 l-5.5 5.5 M160 136 l5.5 5.5 M165.5 136 l-5.5 5.5" stroke="#9e1b1b" stroke-width="1.3" stroke-linecap="round"/>
    <use href="#rows"/>
    <!-- the magnifying glass -->
    <ellipse cx="236" cy="134" rx="24" ry="20" fill="#000" opacity=".35" filter="url(#soft)"/>
    <path d="M250 150 L278 176" stroke="#000" stroke-opacity=".4" stroke-width="8" stroke-linecap="round" filter="url(#soft)"/>
    <g clip-path="url(#lens)">
      <rect x="200" y="96" width="50" height="48" fill="#e8dcbe"/>
      <use href="#rows" transform="translate(224 120) scale(1.7) translate(-226 -122)"/>
      <circle cx="224" cy="120" r="19" fill="#fff4d8" opacity=".12"/>
    </g>
    <path d="M211 107 A17 17 0 0 1 226 103" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="224" cy="120" r="19" fill="none" stroke="#b8923e" stroke-width="4"/>
    <circle cx="224" cy="120" r="21" fill="none" stroke="#5a3e14" stroke-width=".8"/>
    <path d="M238 134 L245 141" stroke="#b8923e" stroke-width="6"/>
    <path d="M246 142 L270 166" stroke="#2a1409" stroke-width="7.5" stroke-linecap="round"/>
    <path d="M247 140.5 L270 163.5" stroke="#6a3a1c" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M206 112 A19 19 0 0 1 216 102.5" fill="none" stroke="#ffe8a8" stroke-width="1.2" filter="url(#glow)"/>
  </g>
  <!-- the pencil -->
  <g transform="translate(100 182) rotate(-7)">
    <rect x="12" y="1" width="64" height="5" fill="#000" opacity=".35" filter="url(#soft)"/>
    <rect x="10" y="-2.5" width="58" height="5" fill="#c8922a"/>
    <rect x="10" y="-1" width="58" height="1.2" fill="#e8b850"/>
    <path d="M10 -2.5 L0 0 L10 2.5Z" fill="#e8c89a"/>
    <path d="M3.5 -.9 L0 0 L3.5 .9Z" fill="#2a2a2a"/>
    <rect x="68" y="-2.6" width="5" height="5.2" fill="#a8a498"/>
    <rect x="73" y="-2.4" width="4" height="4.8" rx="1.2" fill="#b0544a"/>
  </g>
  <rect width="360" height="200" fill="url(#vig)"/>
</svg>
