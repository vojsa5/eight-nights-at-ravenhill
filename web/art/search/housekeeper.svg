<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
  <title>The seating plan of the long dining table, two places beside the head of the table ringed in pencil, next to a heavy iron ring of house keys</title>
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="85%">
      <stop offset="0" stop-color="#46301a"/>
      <stop offset="1" stop-color="#060403"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="52%" r="75%">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".85"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffc870" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ffc870" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flame" cx="50%" cy="70%" r="60%">
      <stop offset="0" stop-color="#fff4c8"/>
      <stop offset=".6" stop-color="#ffb040"/>
      <stop offset="1" stop-color="#ff7a20" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <g id="key">
      <circle r="5" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <rect x="4.5" y="-1.3" width="26" height="2.6" fill="currentColor"/>
      <rect x="9" y="-2.6" width="2.2" height="5.2" fill="currentColor"/>
      <path d="M23 1 L31 1 L31 7.5 L28.5 7.5 L28.5 5 L26.5 5 L26.5 7.5 L23 7.5Z" fill="currentColor"/>
    </g>
  </defs>
  <rect width="360" height="200" fill="url(#bg)"/>
  <!-- candle in its chamberstick -->
  <circle cx="72" cy="52" r="30" fill="#ffb050" opacity=".22" filter="url(#soft)"/>
  <rect x="67" y="60" width="10" height="36" fill="#e6dac0"/>
  <rect x="67" y="60" width="4" height="36" fill="#fff4dc" opacity=".5"/>
  <path d="M67 60 Q72 58 77 60 L77 66 Q75 64 74 68 Q73 62 70 64 Q68 62 67 66Z" fill="#fffae8"/>
  <path d="M72 59 L72 54" stroke="#2a1a10" stroke-width="1"/>
  <path d="M72 38 C76 46 77 52 72 56 C67 52 68 46 72 38Z" fill="url(#flame)" filter="url(#glow)"/>
  <!-- table -->
  <rect x="0" y="96" width="360" height="104" fill="#1c130b"/>
  <rect x="0" y="96" width="360" height="2" fill="#2e1e10"/>
  <ellipse cx="72" cy="98" rx="18" ry="4" fill="#8a6a30"/>
  <ellipse cx="72" cy="96.5" rx="8" ry="2" fill="#5a4220"/>
  <ellipse cx="176" cy="134" rx="160" ry="58" fill="url(#pool)"/>
  <!-- the seating plan -->
  <g transform="rotate(-3 150 128)">
    <rect x="90" y="96" width="140" height="76" rx="2" fill="#000" opacity=".45" filter="url(#soft)"/>
    <rect x="84" y="90" width="140" height="76" rx="2" fill="#eee3c8"/>
    <rect x="89" y="95" width="130" height="66" fill="none" stroke="#a08a60" stroke-width=".6"/>
    <path d="M136 101 L172 101" stroke="#4a3a2a" stroke-width="1.4"/>
    <rect x="104" y="118" width="100" height="18" fill="#e2d2ae" stroke="#4a3a2a" stroke-width="1"/>
    <g fill="none" stroke="#4a3a2a" stroke-width="1">
      <circle cx="111" cy="111" r="3.6"/><circle cx="125" cy="111" r="3.6"/><circle cx="139" cy="111" r="3.6"/><circle cx="154" cy="111" r="3.6"/><circle cx="168" cy="111" r="3.6"/><circle cx="182" cy="111" r="3.6"/><circle cx="196" cy="111" r="3.6"/>
      <circle cx="111" cy="143" r="3.6"/><circle cx="125" cy="143" r="3.6"/><circle cx="139" cy="143" r="3.6"/><circle cx="154" cy="143" r="3.6"/><circle cx="168" cy="143" r="3.6"/><circle cx="182" cy="143" r="3.6"/><circle cx="196" cy="143" r="3.6"/>
      <circle cx="97" cy="127" r="3.6"/>
    </g>
    <circle cx="211" cy="127" r="3.6" fill="#4a3a2a"/>
    <path d="M107 104.5 L115 104.5 M121 104.5 L129 104.5 M135 104.5 L143 104.5 M150 104.5 L158 104.5 M164 104.5 L172 104.5 M178 104.5 L186 104.5 M192 104.5 L200 104.5 M107 149.5 L115 149.5 M121 149.5 L129 149.5 M135 149.5 L143 149.5 M150 149.5 L158 149.5 M164 149.5 L172 149.5 M178 149.5 L186 149.5 M192 149.5 L200 149.5" stroke="#8a7658" stroke-width=".7"/>
    <g fill="none" stroke="#5a5a62" stroke-width="1.2" stroke-linecap="round">
      <path d="M190 106 C191 102 202 102 202 110 C202 117 190 117 190 111 C190 107 194 105 199 106"/>
      <path d="M190 139 C190 135 202 134 202 142 C203 149 191 150 190 144 C189 140 193 137 198 138"/>
    </g>
  </g>
  <!-- the ring of house keys -->
  <g transform="translate(262 128) scale(1.12)">
    <ellipse cx="4" cy="8" rx="46" ry="40" fill="#000" opacity=".4" filter="url(#soft)"/>
    <use href="#key" color="#6a645c" transform="rotate(-72) translate(21 0) rotate(8)"/>
    <use href="#key" color="#a07e40" transform="rotate(-28) translate(21 0) rotate(-6)"/>
    <use href="#key" color="#58534c" transform="rotate(14) translate(21 0) rotate(10) scale(1.15)"/>
    <use href="#key" color="#746c62" transform="rotate(56) translate(21 0) rotate(-4)"/>
    <use href="#key" color="#8e7038" transform="rotate(98) translate(21 0) rotate(6) scale(.9)"/>
    <use href="#key" color="#605a52" transform="rotate(138) translate(21 0) rotate(-8) scale(1.1)"/>
    <circle r="21" fill="none" stroke="#1a1816" stroke-width="5.5"/>
    <circle r="21" fill="none" stroke="#5c5852" stroke-width="3.5"/>
    <path d="M-19 -9 A21 21 0 0 1 6 -20" fill="none" stroke="#e0b070" stroke-width="1.3" filter="url(#glow)"/>
  </g>
  <rect width="360" height="200" fill="url(#vig)"/>
</svg>
