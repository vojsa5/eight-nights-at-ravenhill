<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
  <title>A love letter sealed with red wax beside a lace handkerchief half unwrapped around an empty poison vial, and a single red rose</title>
  <defs>
    <radialGradient id="bg" cx="45%" cy="55%" r="80%">
      <stop offset="0" stop-color="#3e1a24"/>
      <stop offset="1" stop-color="#070305"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="55%" r="75%">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".88"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffc070" stop-opacity=".3"/>
      <stop offset="1" stop-color="#ffc070" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lace" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="none" stroke="#fff" stroke-width=".6"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="360" height="200" fill="url(#bg)"/>
  <!-- dressing table and candlelight -->
  <rect y="104" width="360" height="96" fill="#1e0e12"/>
  <ellipse cx="185" cy="140" rx="150" ry="46" fill="url(#pool)"/>
  <circle cx="86" cy="58" r="26" fill="#ffb050" opacity=".22" filter="url(#soft)"/>
  <rect x="80" y="64" width="12" height="42" fill="#e6d8bc"/>
  <ellipse cx="86" cy="106" rx="14" ry="3.5" fill="#8a6a30"/>
  <path d="M86 46 C90 53 90 60 86 62 C82 60 82 53 86 46Z" fill="#ffd27a" filter="url(#glow)"/>
  <!-- the envelope and the letter peeking out -->
  <g transform="rotate(-7 130 128)">
    <rect x="92" y="92" width="76" height="34" fill="#f2e8d4"/>
    <g fill="none" stroke="#6a4a50" stroke-width=".9">
      <path d="M98 100 q3 -3 6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0"/>
      <path d="M98 107 q3 -3 6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0"/>
      <path d="M98 114 q3 -3 6 0 t6 0 t6 0 t6 0 t6 0"/>
    </g>
    <rect x="84" y="108" width="92" height="52" fill="#e6d6b8"/>
    <path d="M84 108 L130 138 L176 108" fill="#d8c6a4" stroke="#a8906c" stroke-width="1"/>
    <circle cx="130" cy="138" r="8" fill="#a8121e" filter="url(#glow)"/>
    <path d="M130 142 C124 137 126 132 130 135 C134 132 136 137 130 142Z" fill="#6a0610"/>
  </g>
  <!-- lace handkerchief -->
  <path d="M184 112 L266 104 L286 148 L196 160Z" fill="#d4c6cc" opacity=".92"/>
  <path d="M184 112 L266 104 L286 148 L196 160Z" fill="url(#lace)" opacity=".35"/>
  <path d="M184 112 L266 104 L286 148 L196 160Z" fill="none" stroke="#f6eef0" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 5"/>
  <path d="M191 116 L262 109 L279 145 L201 155Z" fill="none" stroke="#b8a8ae" stroke-width=".8" stroke-dasharray="2 2"/>
  <!-- the empty vial -->
  <g transform="rotate(-18 236 130)">
    <circle cx="236" cy="130" r="16" fill="#bff0d8" opacity=".12" filter="url(#soft)"/>
    <rect x="216" y="124" width="36" height="12" rx="6" fill="#d8f4ea" fill-opacity=".35" stroke="#f4fffa" stroke-width="1.2" filter="url(#glow)"/>
    <rect x="250" y="125" width="9" height="10" rx="2" fill="#7a4826"/>
    <path d="M222 127 L246 127" stroke="#fff" stroke-width="1.2" opacity=".8"/>
    <ellipse cx="240" cy="132.5" rx="4" ry="1.6" fill="#5ad098" opacity=".7"/>
  </g>
  <!-- the folded corner of the handkerchief -->
  <path d="M184 112 L236 134 L196 160Z" fill="#000" opacity=".5" transform="translate(3 3)" filter="url(#glow)"/>
  <path d="M184 112 C204 116 222 124 236 134 C222 140 206 150 196 160Z" fill="#f4ecef"/>
  <path d="M184 112 C204 116 222 124 236 134 C222 140 206 150 196 160Z" fill="url(#lace)" opacity=".4"/>
  <path d="M184 112 C204 116 222 124 236 134 C222 140 206 150 196 160" fill="none" stroke="#f6eef0" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 5"/>
  <path d="M190 118 C198 128 200 140 198 152" fill="none" stroke="#9a8a90" stroke-width="1" opacity=".7"/>
  <!-- a single red rose -->
  <path d="M100 184 C130 176 160 170 188 164" fill="none" stroke="#2e5a2a" stroke-width="3" stroke-linecap="round"/>
  <path d="M132 176 L130 171 M156 170 L158 175" stroke="#2e5a2a" stroke-width="1.6"/>
  <path d="M144 173 C142 162 152 156 162 158 C158 168 152 172 144 173Z" fill="#3a6e30"/>
  <path d="M144 173 C150 166 156 162 162 158" stroke="#1e3a1a" stroke-width=".8" fill="none"/>
  <path d="M184 166 L178 160 M186 164 L182 170" stroke="#3a6e30" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M185 166 C182 154 190 146 200 147 C212 148 214 160 208 168 C202 175 190 174 185 166Z" fill="#7a0a16"/>
  <circle cx="198" cy="161" r="12" fill="#9a1020"/>
  <path d="M187 158 C190 148 206 147 210 156 C206 152 194 152 190 162Z" fill="#c42a38"/>
  <path d="M198 161 m-3 0 a3 3 0 1 1 5 2 a6 6 0 1 1 -9 -5 a9 9 0 1 1 12 11" fill="none" stroke="#4e0610" stroke-width="1.4"/>
  <rect width="360" height="200" fill="url(#vig)"/>
</svg>
