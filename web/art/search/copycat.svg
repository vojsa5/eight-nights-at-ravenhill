<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
  <title>A black candlestick telephone on a lamplit desk among sheets of practised handwriting, beside a framed silhouette of Lord Edmund</title>
  <defs>
    <radialGradient id="bg" cx="45%" cy="50%" r="80%">
      <stop offset="0" stop-color="#3e2e1c"/>
      <stop offset="1" stop-color="#060403"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="55%" r="75%">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".88"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffc878" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ffc878" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a4a14"/>
      <stop offset="1" stop-color="#ffb04a"/>
    </linearGradient>
    <clipPath id="oval"><ellipse cx="262" cy="104" rx="15" ry="20"/></clipPath>
    <path id="hw" d="M0 0 c2 -5 4 -5 4 0 c0 3 3 3 5 -1 c2 -4 3 1 5 1 c2 0 3 -4 5 -2 c1 2 3 2 5 0 l6 -1"/>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="360" height="200" fill="url(#bg)"/>
  <!-- lamplight on the wall behind the telephone -->
  <circle cx="150" cy="100" r="70" fill="#ffb060" opacity=".18" filter="url(#soft)"/>
  <!-- desk -->
  <rect y="136" width="360" height="64" fill="#1c130b"/>
  <ellipse cx="170" cy="156" rx="140" ry="34" fill="url(#pool)"/>
  <!-- the lamp -->
  <rect x="84" y="94" width="5" height="44" fill="#6a5028"/>
  <ellipse cx="86.5" cy="138" rx="14" ry="3.5" fill="#4a3618"/>
  <path d="M70 68 L103 68 L112 96 L61 96Z" fill="url(#shade)" filter="url(#glow)"/>
  <path d="M61 96 L112 96" stroke="#ffd690" stroke-width="2" stroke-dasharray="1.5 2"/>
  <!-- sheets of practised handwriting -->
  <g transform="rotate(-11 128 158)" fill="none" stroke="#3a2c20" stroke-width=".9">
    <rect x="98" y="140" width="60" height="38" fill="#eee2c6" stroke="none"/>
    <use href="#hw" x="104" y="148"/><use href="#hw" x="104" y="155"/><use href="#hw" x="104" y="162"/><use href="#hw" x="104" y="169"/>
  </g>
  <g transform="rotate(8 232 160)" fill="none" stroke="#3a2c20" stroke-width=".9">
    <rect x="204" y="144" width="58" height="36" fill="#e6d8b8" stroke="none"/>
    <use href="#hw" x="210" y="152"/><use href="#hw" x="210" y="159"/><use href="#hw" x="210" y="166"/><use href="#hw" x="210" y="173"/>
  </g>
  <g transform="rotate(-3 180 146)" fill="none" stroke="#3a2c20" stroke-width=".9">
    <rect x="148" y="138" width="62" height="20" fill="#f4ead2" stroke="none"/>
    <use href="#hw" x="152" y="145"/><use href="#hw" x="180" y="145"/><use href="#hw" x="152" y="152"/>
  </g>
  <!-- the framed silhouette -->
  <path d="M262 128 L252 142 M262 128 L272 142" stroke="#5a4020" stroke-width="2"/>
  <ellipse cx="262" cy="104" rx="19" ry="24" fill="#2a1c0c" stroke="#c89a48" stroke-width="3" filter="url(#glow)"/>
  <ellipse cx="262" cy="104" rx="15" ry="20" fill="#eadcbc"/>
  <path clip-path="url(#oval)" fill="#0c0908" d="M246 126 C247 122 250 120 252 118 C249 116 250 113 252 111 L251 109 L252 107 L248 104 L253 99 L252 95 C253 90 258 86 264 86 C271 86 275 92 274 100 C276 104 274 108 271 112 C272 116 275 119 280 122 L280 126Z"/>
  <path clip-path="url(#oval)" d="M251 121 L256 118 L258 123Z" fill="#eadcbc"/>
  <!-- candlestick telephone -->
  <ellipse cx="180" cy="152" rx="26" ry="5" fill="#070605"/>
  <path d="M158 151 C158 140 202 140 202 151Z" fill="#0c0a09"/>
  <path d="M160 148 C162 143 170 141 176 141" stroke="#8a6a40" stroke-width="1.2" fill="none" opacity=".8"/>
  <rect x="176" y="72" width="8" height="72" fill="#0c0a09"/>
  <path d="M176.5 76 L176.5 140" stroke="#a07a48" stroke-width="1" opacity=".7"/>
  <path d="M174 66 L186 66 L185 74 L175 74Z" fill="#0c0a09"/>
  <circle cx="180" cy="58" r="12" fill="#0c0a09"/>
  <circle cx="180" cy="58" r="7" fill="#1c1814" stroke="#8a6a40" stroke-width=".8"/>
  <circle cx="180" cy="58" r="2.5" fill="#050404"/>
  <path d="M184 90 L197 88 L199 78" fill="none" stroke="#0c0a09" stroke-width="3" stroke-linecap="round"/>
  <path d="M189 74 L207 74 L203 86 L193 86Z" fill="#0c0a09"/>
  <rect x="194" y="85" width="8" height="32" rx="3" fill="#0c0a09"/>
  <path d="M195 88 L195 114" stroke="#8a6a40" stroke-width=".8" opacity=".7"/>
  <path d="M198 117 C200 134 212 146 196 150 C188 152 196 152 200 150" fill="none" stroke="#0c0a09" stroke-width="1.8"/>
  <path d="M202 150 C230 152 262 148 300 158" fill="none" stroke="#0c0a09" stroke-width="2"/>
  <rect width="360" height="200" fill="url(#vig)"/>
</svg>
