<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
  <title>Candlelit sheets covered with the same signature practised over and over, with a fountain pen, an ink bottle and a magnifying glass</title>
  <defs>
    <radialGradient id="bg" cx="45%" cy="50%" r="80%">
      <stop offset="0" stop-color="#26203a"/>
      <stop offset="1" stop-color="#040308"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="55%" r="75%">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".88"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffc070" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ffc070" stop-opacity="0"/>
    </radialGradient>
    <path id="sig" d="M0 4 c2 -9 5 -9 4 -1 c-1 5 -3 7 -2 4 c1 -4 4 -5 6 -2 c1 2 2 1 3 -1 c1 -3 3 -2 3 1 c0 2 2 2 4 -1 c2 -3 3 -1 4 1 c1 2 3 0 5 -2 M-1 7 C8 5 18 6 30 4"/>
    <clipPath id="lens"><circle cx="212" cy="122" r="17"/></clipPath>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="360" height="200" fill="url(#bg)"/>
  <!-- desk and candlelight -->
  <rect y="100" width="360" height="100" fill="#171220"/>
  <ellipse cx="180" cy="140" rx="160" ry="52" fill="url(#pool)"/>
  <!-- candle -->
  <circle cx="92" cy="50" r="28" fill="#ffb050" opacity=".24" filter="url(#soft)"/>
  <rect x="86" y="58" width="12" height="54" fill="#e6d8bc"/>
  <path d="M86 62 C84 68 85 72 86 74" stroke="#f4ead6" stroke-width="2" fill="none"/>
  <path d="M84 112 L100 112 L104 120 L80 120Z" fill="#9a7434"/>
  <ellipse cx="92" cy="121" rx="18" ry="4" fill="#7a5a24"/>
  <path d="M92 38 C96 45 96 52 92 55 C88 52 88 45 92 38Z" fill="#ffd27a" filter="url(#glow)"/>
  <!-- sheets of one signature, again and again -->
  <g transform="rotate(7 196 138)">
    <rect x="150" y="96" width="92" height="84" fill="#e2d6b8"/>
  </g>
  <g transform="rotate(-5 176 138)" fill="none" stroke="#1a1428" stroke-width="1.1" stroke-linecap="round">
    <rect x="124" y="94" width="104" height="88" fill="#f0e6ce" stroke="none"/>
    <use href="#sig" x="132" y="100"/><use href="#sig" x="180" y="100"/>
    <use href="#sig" x="132" y="114"/><use href="#sig" x="180" y="114"/>
    <use href="#sig" x="132" y="128"/><use href="#sig" x="180" y="128"/>
    <use href="#sig" x="132" y="142"/><use href="#sig" x="180" y="142"/>
    <use href="#sig" x="132" y="156"/><use href="#sig" x="180" y="156"/>
    <use href="#sig" x="132" y="170"/>
  </g>
  <!-- ink bottle -->
  <circle cx="272" cy="130" r="24" fill="#8a90ff" opacity=".08" filter="url(#soft)"/>
  <path d="M258 116 L286 116 L290 150 L254 150Z" fill="#8a9ac8" fill-opacity=".22" stroke="#b8c0e0" stroke-opacity=".7" stroke-width="1.2"/>
  <path d="M256.5 128 L287.5 128 L290 150 L254 150Z" fill="#141a52"/>
  <path d="M256.5 128 L287.5 128" stroke="#4a5ab0" stroke-width="1.2"/>
  <rect x="264" y="104" width="16" height="12" rx="2" fill="#2a2030" stroke="#8a6a40" stroke-width="1"/>
  <path d="M259 119 L261.5 146" stroke="#ffd8a0" stroke-width="1.6" opacity=".75"/>
  <ellipse cx="272" cy="150" rx="19" ry="3" fill="#000" opacity=".5"/>
  <!-- fountain pen -->
  <path d="M112 186 L170 160 L172 164 L114 190Z" fill="#0c0a10"/>
  <path d="M140 173 L146 170.5 L148 174.5 L142 177Z" fill="#c8a040"/>
  <path d="M170 160 L180 157 L172 164Z" fill="#d8b050"/>
  <circle cx="182" cy="157" r="2" fill="#1a1428"/>
  <!-- magnifying glass over one signature -->
  <path d="M225 135 L248 160" stroke="#3a2a18" stroke-width="7" stroke-linecap="round"/>
  <path d="M225 135 L231 142" stroke="#b08a40" stroke-width="7.5"/>
  <g clip-path="url(#lens)">
    <rect x="190" y="100" width="44" height="44" fill="#f6eed8"/>
    <use href="#sig" transform="translate(212 122) rotate(-5) scale(1.9) translate(-15 -5)" fill="none" stroke="#1a1428" stroke-width="1" stroke-linecap="round"/>
  </g>
  <circle cx="212" cy="122" r="17" fill="#d0e0ff" opacity=".1"/>
  <path d="M200 112 C204 107 210 106 214 107" stroke="#fff" stroke-width="1.6" fill="none" opacity=".7"/>
  <circle cx="212" cy="122" r="18" fill="none" stroke="#c89a48" stroke-width="3" filter="url(#glow)"/>
  <rect width="360" height="200" fill="url(#vig)"/>
</svg>
