    <ellipse cx="192" cy="80" rx="6" ry="4.6" fill="#f2eadc"/>
    <circle cx="168" cy="80" r="3" fill="#90a2b2" stroke="#4a5a6c" stroke-width=".7"/>
    <circle cx="192" cy="80" r="3" fill="#90a2b2" stroke="#4a5a6c" stroke-width=".7"/>
    <circle cx="168" cy="80" r=".7" fill="#141820"/><circle cx="192" cy="80" r=".7" fill="#141820"/>
    <path d="M163.5 78.5C165.5 76.5 170.5 76.5 172.5 78.5M187.5 78.5C189.5 76.5 194.5 76.5 196.5 78.5" fill="none" stroke="#fff" stroke-width=".6" opacity=".7"/>
