  <g fill="#2a3448"><rect x="276" y="62" width="10" height="3"/><rect x="304" y="66" width="10" height="3"/><rect x="332" y="60" width="10" height="3"/><rect x="277" y="110" width="10" height="3"/><rect x="309" y="108" width="10" height="3"/></g>
