<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" data-cut="black">
  <title>In the strongroom by candlelight, Lord Edmund stares with blank eyes at a silver watch swinging before his face, and holds out his late wife's pearls</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#1e2636"/>
      <stop offset="1" stop-color="#040508"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="48%" r="75%">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".88"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffc070" stop-opacity=".3"/>
      <stop offset="1" stop-color="#ffc070" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" gradientUnits="userSpaceOnUse" x1="166" y1="54" x2="196" y2="114">
      <stop offset="0" stop-color="#2e2834"/>
      <stop offset=".48" stop-color="#94604c"/>
      <stop offset="1" stop-color="#f6c292"/>
    </linearGradient>
    <linearGradient id="hand" gradientUnits="userSpaceOnUse" x1="0" y1="110" x2="0" y2="150">
      <stop offset="0" stop-color="#8a6458"/>
      <stop offset="1" stop-color="#e8b088"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".2" stop-color="#5a5c68"/>
      <stop offset="1" stop-color="#b8b6b4"/>
    </linearGradient>
    <radialGradient id="wall" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6a6070" stop-opacity=".45"/>
      <stop offset="1" stop-color="#6a6070" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="360" height="200" fill="url(#bg)"/>
  <!-- the strongroom: its steel door standing open, iron shelves of deed boxes -->
  <path d="M24 14H100V200H24Z" fill="#141a26"/>
  <path d="M30 20H94V200H30Z" fill="#06080c"/>
  <path d="M30 20L8 8V200H30Z" fill="#232b3c"/>
  <g fill="#3a4458"><circle cx="30" cy="60" r="3"/><circle cx="30" cy="100" r="3"/><circle cx="30" cy="140" r="3"/></g>
  <circle cx="18" cy="104" r="7" fill="none" stroke="#4a5468" stroke-width="2"/>
  <g fill="#10141e" stroke="#2a3244" stroke-width="1.2">
    <path d="M262 30H352V34H262ZM262 78H352V82H262ZM262 126H352V130H262Z"/>
  </g>
  <g fill="#0c0f16">
    <rect x="268" y="50" width="26" height="28"/><rect x="298" y="56" width="22" height="22"/><rect x="324" y="48" width="26" height="30"/>
    <rect x="270" y="100" width="24" height="26"/><rect x="300" y="96" width="28" height="30"/>
