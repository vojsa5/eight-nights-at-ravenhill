    <circle cx="180" cy="98" r="11" fill="#e8ecf4" opacity=".18" filter="url(#glow)"/>
    <circle cx="180" cy="87.5" r="2.2" fill="none" stroke="#c8ccd6" stroke-width="1.2"/>
    <circle cx="180" cy="98" r="8.6" fill="#a8acb8" stroke="#e4e8f0" stroke-width="1.4"/>
    <circle cx="180" cy="98" r="7" fill="#f6f0e2"/>
    <path d="M180 91.5V93M180 103V104.5M173.5 98H175M185 98H186.5M183 92.5L182.5 93.5M186 95L185 96M186 101L185 100M183 103.5L182.5 102.5M177 103.5L177.5 102.5M174 101L175 100M174 95L175 96M177 92.5L177.5 93.5" stroke="#5a4c34" stroke-width=".6"/>
