  <path d="M221 146C221 141 225 139 231 139C237 139 241 141 241 146V150C241 153 237 154 231 154C225 154 221 153 221 150Z" fill="url(#hand)"/>
  <path d="M226 141V152M231 140.5V153M236 141V152" stroke="#7a5244" stroke-width=".7"/>
  <ellipse cx="234" cy="140" rx="15" ry="3.6" fill="#8a6a30"/>
  <ellipse cx="234" cy="139" rx="13" ry="2.7" fill="#c89a48"/>
  <circle cx="249" cy="141" r="3" fill="none" stroke="#a07a34" stroke-width="1.4"/>
  <rect x="231" y="122" width="6" height="17" fill="#ece0c4"/>
  <path d="M231 122H237" stroke="#fff6e0"/>
  <circle cx="234" cy="112" r="18" fill="#ffb050" opacity=".3" filter="url(#soft)"/>
  <path class="lf-flame" d="M234 109C238 115 238 119 234 122C230 119 230 115 234 109Z" fill="#ffd27a" filter="url(#glow)"/>
  <g data-fx="glow" data-at="234 116" data-r="40" data-tone="candle"/>
