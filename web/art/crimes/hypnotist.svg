    <ellipse cx="204" cy="86" rx="4.5" ry="8" fill="#c08868"/>
    <path d="M155 76C151 60 160 48 168 46C171 44 175 44.5 177 45.5C179 44.5 183 44.5 185 45.5C188 44.5 194 46 196 48C204 52 209 62 205 76L199 64C192 58 168 58 161 64Z" fill="url(#hair)"/>
    <path d="M167 58C165 54 163 51 160 49M172.5 56.5C171.5 52 170 49 168 47M178.5 56V46.5M184 56.5C185 52 186.5 49 188.5 47.5M190 58C192 54 195 51 198 50" fill="none" stroke="#c8c6c2" stroke-width=".7" opacity=".55"/>
    <path d="M155 78C150 70 152 62 158 60C156 66 158 72 162 74ZM205 78C210 70 208 62 202 60C204 66 202 72 198 74Z" fill="#cfccc6"/>
