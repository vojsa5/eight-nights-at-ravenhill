    <path d="M140 136V149M143.5 153.5" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round" stroke-dasharray="0 3.2" opacity=".8"/>
    <path class="lf-glint" style="--d:-1.2s" d="M147 146L147.5 149.5L151 150L147.5 150.5L147 154L146.5 150.5L143 150L146.5 149.5Z" fill="#fffbe8" opacity="0"/>
  </g>
  <!-- his other hand, carrying the chamberstick that lights him -->
  <path d="M254 200C252 178 246 160 240 150L220 152C224 166 228 184 228 200Z" fill="#0b0c12"/>
