  </g>
  <path d="M166 0C166 4 169 7 173 8L178.5 9.5C180 10 181.5 9.5 182 8.5L184 6C188 5.5 193 3.5 194 0Z" fill="#08080b"/>
  <path d="M170 3C172 5.5 175 6.5 178 7M183.5 6.5C182 5.5 181 4 181 2" fill="none" stroke="#3a3a46" stroke-width=".7"/>
  <!-- where the flashback lays the guest's photograph, over the one who did it -->
  <g data-fx="guest" data-at="130 62"/>
  <rect width="360" height="200" fill="url(#vig)"/>
</svg>
