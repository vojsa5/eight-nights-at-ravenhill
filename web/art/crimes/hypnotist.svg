  <path d="M122 139C121 134 122 131 124 129H140C142 131 143 134 142 139C138 141 126 141 122 139Z" fill="#d89a76"/>
  <path d="M122.5 128.5C121.5 124 122 119 124 117.5C125.5 116.5 127 117.5 127 119.5L127.5 126ZM127.5 126.5C127 121 127.5 116 129.5 115C131 114.5 132.5 115.5 132.5 117.5L132.5 126ZM132.5 126C132.5 120.5 133.5 116 135.5 115.5C137 115 138 116.5 138 118.5L137.5 126.5ZM137.5 127C137.5 122.5 138.5 119.5 140 119C141.5 119 142.5 120.5 142 122L141.5 128.5Z" fill="url(#hand)"/>
  <path d="M127 119V126M132.5 117.5V126M138 118.5V126.5" stroke="#6a4a40" stroke-width=".6"/>
