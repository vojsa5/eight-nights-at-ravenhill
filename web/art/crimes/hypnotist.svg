    <path d="M174 97C176 99.5 184 99.5 186 97C185 95 182 94.5 180 94.5C178 94.5 175 95 174 97Z" fill="#f0bc90"/>
    <ellipse cx="177.5" cy="97.5" rx="1.3" ry=".8" fill="#3a2018"/><ellipse cx="182.5" cy="97.5" rx="1.3" ry=".8" fill="#3a2018"/>
    <path d="M172 94C169 98 168 101 168 104M188 94C191 98 192 101 192 104" fill="none" stroke="#a06a50" stroke-width=".8"/>
