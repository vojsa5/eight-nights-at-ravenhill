  <!-- in the films (css/film.css + the scene's own rules): the shears snap shut, the spark flashes, the cut ends
       fall and snow drops off the wire; the snow falls thicker, the window's lamp hums -->
  <g class="lf-droop" style="transform-box:view-box;transform-origin:308px 28px;--fall:-34deg">
    <path d="M308 28Q234.5 74.5 180 89.5" fill="none" stroke="#05070c" stroke-width="1.5"/>
    <path d="M308 27Q234.5 73.5 180 88.5" fill="none" stroke="#e8eef8" stroke-width=".9" opacity=".85"/>
  </g>
  <g class="lf-droop" style="transform-box:view-box;transform-origin:146px 96px;--fall:96deg">
    <path d="M146 96Q162 94.5 180 89.5" fill="none" stroke="#05070c" stroke-width="1.5"/>
    <path d="M146 95Q162 93.5 180 88.5" fill="none" stroke="#e8eef8" stroke-width=".9" opacity=".85"/>
  </g>
  <g fill="#eef3fa"><circle class="lf-sift" style="--d:.66s" cx="178" cy="88" r="1" opacity="0"/><circle class="lf-sift" style="--d:.7s" cx="183" cy="87" r=".8" opacity="0"/><circle class="lf-sift" style="--d:.68s" cx="186" cy="86" r="1.1" opacity="0"/><circle class="lf-sift" style="--d:.74s" cx="174" cy="89.5" r=".7" opacity="0"/><circle class="lf-sift" style="--d:.8s" cx="190" cy="85" r=".8" opacity="0"/><circle class="lf-sift" style="--d:.72s" cx="170" cy="90.5" r=".9" opacity="0"/></g>
  <!-- the garden shears in two gloved hands -->
    <g class="lf-snip" style="transform-box:view-box;transform-origin:197.5px 107px;--open:12deg;--shut:-5deg">
      <path d="M227.5 147.5C257 188 292 236.5 321.5 277L300 291.5C274.5 248 244.5 196.5 216 152.5Z" fill="#141a28"/>
      <g fill="#c8d4e8" opacity=".75"><circle cx="234.5" cy="167" r=".6"/><circle cx="241.5" cy="186.5" r=".6"/><circle cx="256" cy="195.5" r=".6"/></g>
      <path d="M201.5 121.5L191.5 106.5 195.5 104 205.5 119Z" fill="#5a6274"/>
      <path d="M221 151.5L201 122 205 119 225.5 149Z" fill="#6a4020"/>
      <path d="M222.5 148L205 121.5" stroke="#b07a40" stroke-width="1" opacity=".8"/>
      <path d="M202 123.5L200 121 204.5 117.5 206.5 120.5Z" fill="#9a8a5a"/>
      <path d="M229.5 149.5L233 154.5 220.5 163 217.5 155.5Z" fill="#1e2230"/>
      <path d="M217.5 133.5C210.5 137 208.5 143 212 148C215.5 153 219.5 154 223.5 152.5L228.5 149C226.5 143 222 136.5 217.5 133.5Z" fill="#0a090c"/>
      <path d="M214 140.5C212 141.5 211 143 211 145M216 144.5C213.5 145.5 212.5 146.5 213 148.5M218.5 147.5C216 148.5 215 150 215.5 152" fill="none" stroke="#2e2e3a" stroke-width=".7"/>
      <path d="M199 103.5L181.5 82Q173 73 167.5 71L194.5 104.5Z" fill="#7a8498"/>
      <path d="M194.5 103.5L168 72" stroke="#eef4ff" stroke-width=".7" opacity=".9"/>
    </g>
    <g class="lf-snip" style="transform-box:view-box;transform-origin:197.5px 107px;--open:-12deg;--shut:5deg">
      <path d="M234.5 135C275 164 323.5 199.5 364 229L378.5 207.5C335.5 182 283.5 152 239.5 123.5Z" fill="#141a28"/>
      <g fill="#c8d4e8" opacity=".75"><circle cx="254" cy="141.5" r=".6"/><circle cx="273.5" cy="148.5" r=".6"/><circle cx="283" cy="163.5" r=".6"/></g>
      <path d="M209.5 115L194.5 105 197 101 212 111Z" fill="#5a6274"/>
      <path d="M239.5 135L209.5 114.5 212.5 110.5 242 130.5Z" fill="#6a4020"/>
      <path d="M238.5 132L212 114.5" stroke="#b07a40" stroke-width="1" opacity=".8"/>
      <path d="M211 116L208 114 211.5 109.5 214 111.5Z" fill="#9a8a5a"/>
      <path d="M237 137L241.5 140.5 250.5 127.5 242.5 125Z" fill="#1e2230"/>
      <path d="M221 124.5C224 118 230.5 116 235.5 119.5C240.5 122.5 241 127 239.5 130.5L236.5 135.5C230.5 134 223.5 129.5 221 124.5Z" fill="#0a090c"/>
      <path d="M228 121.5C229 119 230 118 232.5 118.5M231.5 123.5C232.5 121 233.5 120 236 120.5M234.5 125.5C235.5 123 237 122.5 239 122.5" fill="none" stroke="#2e2e3a" stroke-width=".7"/>
      <path d="M194 108.5L172.5 91Q163.5 82.5 161.5 77L195 104Z" fill="#a8b0c2"/>
      <path d="M194 104L162.5 77.5" stroke="#eef4ff" stroke-width="1" opacity=".9"/>
    </g>
  <circle cx="197.5" cy="107" r="2.6" fill="#3a404c" stroke="#c8d0e0" stroke-width=".9"/>
  <!-- the spark -->
  <g class="lf-snap">
    <circle cx="180" cy="89.5" r="20" fill="#ffe0a0" opacity=".6" filter="url(#soft)"/>
    <circle cx="180" cy="89.5" r="2.6" fill="#fff6d0" filter="url(#glow)"/>
    <path d="M180 89.5 m-2 -2 l-4 -5 m4 7 l-6 -1 m6 -1 l2 -6 m-1.5 8 l1 6 m-1 -6 l-5 4" fill="none" stroke="#fff4c0" stroke-width=".7" stroke-linecap="round"/>
  </g>
  <g data-fx="breath" data-at="250 92" data-r="16"/>
  <g class="lf-thicken" opacity="0">
    <g class="lf-fall fast">
      <g id="more" fill="#e8eef8"><circle cx="169" cy="21" r="1.4"/><circle cx="337" cy="8" r=".8"/><circle cx="278" cy="14" r="1.2"/><circle cx="302" cy="9" r="1"/><circle cx="23" cy="13" r="1.4"/><circle cx="218" cy="10" r="1"/><circle cx="50" cy="72" r="1.4"/><circle cx="34" cy="107" r=".8"/><circle cx="118" cy="82" r=".8"/><circle cx="299" cy="76" r="1.4"/><circle cx="29" cy="30" r=".8"/><circle cx="289" cy="19" r="1.2"/></g>
      <use href="#more" y="-112"/><use href="#more" y="112"/>
    </g>
  </g>
  <g data-fx="snow"/>
  <!-- where the flashback lays the guest's photograph, over the one who did it -->
  <g data-fx="guest" data-at="224 98"/>
  <rect width="360" height="200" fill="url(#vig)"/>
</svg>
