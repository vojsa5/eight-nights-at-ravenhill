    <rect x="131.5" y="84" width="2" height="25"/>
    <path d="M135 78.5 L128 80 L128.5 84 L134.5 83.5 Z"/>
  </g>
  <path d="M116.3 82 C117 92 127 92 131 104" fill="none" stroke="#3a1e0c" stroke-width=".8"/>
  <path d="M72 62 H136 M104 35 V109" stroke="#1a2030" stroke-width="2.6"/>
  <path d="M64 27 H144" stroke="#dfe7f4" stroke-width="2.4"/>
  <path d="M62 115 C74 110 122 110 146 115 L146 118 H62 Z" fill="#e8eef8"/>
  <g fill="#dfe7f4"><path d="M75 118 L76.5 125 L78 118 Z"/><path d="M91 118 L92 122 L93 118 Z"/><path d="M119 118 L120.5 127 L122 118 Z"/><path d="M135 118 L136 121 L137 118 Z"/></g>
  <path d="M145 150 C120 141 80 144 40 140 C20 139 8 141 0 140 V150Z" fill="#c8d4e8"/>
