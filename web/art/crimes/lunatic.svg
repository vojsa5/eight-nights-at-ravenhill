<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" data-cut="pull" data-cut-at="50% 45%">
  <title>Out in the falling snow beside the lit hall window, two gloved hands close a pair of garden shears on the telephone wire, and it parts in a spark</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#1e2a44"/>
      <stop offset="1" stop-color="#03050a"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="48%" r="75%">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".86"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060a14"/>
      <stop offset=".75" stop-color="#1a2640"/>
      <stop offset="1" stop-color="#2c3a58"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a4b2cc"/>
      <stop offset="1" stop-color="#2e3a56"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdc98"/>
      <stop offset="1" stop-color="#f09040"/>
    </linearGradient>
    <ellipse id="pr" rx="3" ry="1.4"/>
    <pattern id="stone" width="24" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 .5 H24 M0 10.5 H24 M6 .5 V10.5 M18 10.5 V20.5" fill="none" stroke="#242e42" stroke-width=".8"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="360" height="200" fill="url(#bg)"/>
  <!-- the snowy night: the sky, the moor, the garden hedge, the telegraph pole -->
  <rect x="148" width="212" height="124" fill="url(#sky)"/>
  <circle cx="264" cy="40" r="60" fill="#8aa8d8" opacity=".1" filter="url(#soft)"/>
  <path d="M360 112 C320 104 280 108 240 104 C200 100 170 108 148 106 V124 H360Z" fill="#6a7a9c"/>
  <path d="M360 112 C320 104 280 108 240 104 C200 100 170 108 148 106" fill="none" stroke="#a8b8d4" stroke-width="1" opacity=".7"/>
  <g fill="#0c1220"><path d="M290 108 L286 94 L282 108Z"/><path d="M278 107 L275 97 L272 107Z"/><path d="M218 103 L214 91 L210 103Z"/></g>
  <rect x="306" y="22" width="5" height="106" fill="#0c0f18"/>
  <rect x="290" y="30" width="36" height="4" fill="#0c0f18"/>
  <path d="M290 30 H326 M306 22 H311" stroke="#dfe7f4" stroke-width="1.6"/>
  <g fill="#9ab8c8"><rect x="295" y="25.5" width="3" height="4.5" rx="1"/><rect x="318" y="25.5" width="3" height="4.5" rx="1"/><rect x="307" y="24" width="3" height="5" rx="1"/></g>
  <path d="M360 132 V122 C340 118 300 120 260 118 C220 116 180 120 148 118 V132Z" fill="#0e1a18"/>
  <path d="M360 122 C340 118 300 120 260 118 C220 116 180 120 148 118 C180 116 220 114 260 115 C300 116 340 116 360 119Z" fill="#dfe7f4"/>
