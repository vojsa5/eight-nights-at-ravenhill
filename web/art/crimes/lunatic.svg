  <path d="M360 200 V140 C300 134 220 140 145 146 C100 150 40 146 0 148 V200Z" fill="url(#field)"/>
  <path d="M60 148 L140 148 L152 200 L38 200Z" fill="#ffc070" opacity=".16" filter="url(#soft)"/>
  <g fill="#3a4a6a" opacity=".55"><use href="#pr" x="30" y="185"/><use href="#pr" x="54" y="185"/><use href="#pr" x="78" y="174"/><use href="#pr" x="102" y="176"/><use href="#pr" x="126" y="168"/><use href="#pr" x="150" y="173"/><use href="#pr" x="174" y="168"/><use href="#pr" x="198" y="176"/><use href="#pr" x="220" y="174"/><use href="#pr" x="238" y="185"/></g>
