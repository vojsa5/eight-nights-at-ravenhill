  <path class="lf-firelit" d="M146.5 117 C149 119.5 158 121.8 170 122.4" fill="none" stroke="#ff9a5a" stroke-opacity=".45" stroke-width="1"/>
  
  <path d="M152 100 C148 106 151 113 158 113 C165 113 168 106 164 100Z" fill="#d8d0c8" opacity=".25" stroke="#e8e0d8" stroke-opacity=".55"/>
  <path d="M150.5 107 C151.5 111 154 113 158 113 C162 113 164.5 111 165.5 107Z" fill="url(#amber)"/>
