  <path d="M180 154 L166 166 M180 154 L194 166 M180 154 L180 168" stroke="#1e120c" stroke-width="2.4" stroke-linecap="round"/>
  <ellipse cx="180" cy="117" rx="34" ry="6" fill="#2e1a10"/>
