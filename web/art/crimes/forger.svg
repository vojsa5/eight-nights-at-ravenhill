      <path class="lf-firelit" d="M-30 -17 L-30 17" stroke="#ff9a5a" stroke-opacity=".5" stroke-width="1"/>
      <text x="-2" y="-8" text-anchor="middle" font-family="Georgia, serif" font-size="5.2" font-style="italic" fill="#3a2a18">Last Will &amp; Testament</text>
