  <path d="M28 158 L28 60 C28 44 40 36 58 36 L84 36 C97 36 105 42 107 53 C115 55 120 63 120 73 L120 102 L132 102 C140 102 145 107 145 114 C145 121 140 126 133 126 L128 126 L128 158Z" fill="#260c11"/>
  <path d="M107 53 C115 55 120 63 120 73 L120 102 L110 102 L110 62Z" fill="#1a080c"/>
  <g fill="#12050a"><circle cx="46" cy="58" r="1.2"/><circle cx="68" cy="56" r="1.2"/><circle cx="90" cy="58" r="1.2"/><circle cx="57" cy="72" r="1.2"/><circle cx="79" cy="72" r="1.2"/><circle cx="46" cy="86" r="1.2"/><circle cx="68" cy="86" r="1.2"/><circle cx="90" cy="86" r="1.2"/><circle cx="57" cy="100" r="1.2"/><circle cx="79" cy="100" r="1.2"/></g>
  <path d="M28 132 L128 132" stroke="#12050a" stroke-width="1.2"/>
