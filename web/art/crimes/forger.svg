  <!-- the culprit's coat in the foreground, the forgery in its pocket -->
  <g class="lf-near">
    <path d="M298 98 C290 130 284 168 280 204 L364 204 L364 92Z" fill="#08070c"/>
    <path d="M298 98 C290 130 284 168 280 204" fill="none" stroke="#6a72a0" stroke-opacity=".35" stroke-width="1"/>
