  <path d="M58 36 L84 36 C97 36 105 42 107 53 C115 55 120 63 120 73" fill="none" stroke="#7a7aa8" stroke-opacity=".3" stroke-width="1"/>
  <circle cx="133" cy="114" r="7.5" fill="#30121a" stroke="#401a24" stroke-width="1"/>
