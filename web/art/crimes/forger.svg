<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" data-cut="pull" data-cut-at="53% 40%">
  <title>The library at ten past eleven: beside Lord Edmund's armchair a gloved hand lifts the new will from the side table, a forgery in the pocket, as light grows under the door</title>
