      <stop offset="1" stop-color="#000" stop-opacity=".88"/>
    </radialGradient>
    <radialGradient id="ember" cx="0%" cy="70%" r="70%">
      <stop offset="0" stop-color="#ff7a3a" stop-opacity=".42"/>
      <stop offset="1" stop-color="#ff7a3a" stop-opacity="0"/>
