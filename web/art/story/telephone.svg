<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
  <title>The hall telephone, its cord cut, and the snow thickening outside</title>
  <defs>
    <radialGradient id="bg" cx="60%" cy="45%" r="80%">
      <stop offset="0" stop-color="#1e2a3a"/>
      <stop offset="1" stop-color="#040508"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".85"/>
    </radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a82a8"/>
      <stop offset="1" stop-color="#2a3a58"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="360" height="200" fill="url(#bg)"/>
  <!-- window full of snow -->
  <rect x="214" y="24" width="96" height="112" rx="44" fill="url(#win)" opacity=".7"/>
  <path d="M262 24 L262 136 M214 80 L310 80" stroke="#07090e" stroke-width="5"/>
  <g fill="#f0f4fa">
    <circle cx="230" cy="44" r="1.4"/><circle cx="246" cy="62" r="1.1"/><circle cx="280" cy="40" r="1.5"/><circle cx="296" cy="58" r="1.1"/>
    <circle cx="226" cy="96" r="1.3"/><circle cx="250" cy="112" r="1.6"/><circle cx="274" cy="96" r="1.2"/><circle cx="300" cy="104" r="1.5"/>
    <circle cx="238" cy="124" r="1.1"/><circle cx="288" cy="122" r="1.3"/><circle cx="268" cy="54" r="1"/><circle cx="240" cy="80" r="1"/>
  </g>
  <path d="M214 124 C240 116 280 118 310 112 L310 136 L214 136Z" fill="#dfe6f2" opacity=".55"/>
  <!-- hall table -->
  <rect x="40" y="140" width="200" height="8" fill="#1a1410"/>
  <rect x="50" y="148" width="6" height="52" fill="#120e0b"/>
  <rect x="224" y="148" width="6" height="52" fill="#120e0b"/>
  <!-- candlestick telephone, receiver hanging -->
  <ellipse cx="110" cy="140" rx="20" ry="4" fill="#0a0908"/>
  <rect x="106" y="72" width="8" height="68" fill="#0a0908"/>
  <path d="M100 58 L120 58 L118 72 L102 72Z" fill="#0a0908"/>
  <path d="M104 58 C104 50 116 50 116 58Z" fill="#141210"/>
  <path d="M116 96 C134 100 140 120 136 150 C134 164 128 170 126 178" fill="none" stroke="#0a0908" stroke-width="1.6"/>
  <rect x="120" y="176" width="12" height="18" rx="4" fill="#0a0908" transform="rotate(-12 126 185)"/>
  <!-- the cord to the wall, cut -->
  <path d="M110 140 C120 150 150 150 168 146 C176 144 180 142 186 140" fill="none" stroke="#0a0908" stroke-width="2"/>
  <path d="M198 136 C204 134 208 128 212 118" fill="none" stroke="#0a0908" stroke-width="2"/>
  <g stroke="#c8a860" stroke-width=".8">
    <path d="M186 140 L189 137 M186 140 L190 141 M186 140 L188 143"/>
    <path d="M198 136 L195 133 M198 136 L194 137 M198 136 L196 139"/>
  </g>
  <circle cx="192" cy="138" r="2.2" fill="#ffe0a0" opacity=".8" filter="url(#glow)"/>
  <!-- the shears left behind -->
  <g fill="none" stroke="#9a9aa6" stroke-width="2.4" stroke-linecap="round">
    <path d="M164 136 L190 128"/>
    <path d="M164 132 L190 132"/>
  </g>
  <circle cx="160" cy="137" r="4" fill="none" stroke="#6a6a74" stroke-width="2"/>
  <circle cx="160" cy="130" r="4" fill="none" stroke="#6a6a74" stroke-width="2"/>
  <rect width="360" height="200" fill="url(#vig)"/>
</svg>
