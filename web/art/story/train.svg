<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" data-cut="black">
  <title>The last train before the snow: a lone detective on the platform at Ravenhill Halt</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080b14"/>
      <stop offset="1" stop-color="#2e3a56"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".85"/>
    </radialGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff2c8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff2c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <!-- in the films (css/film.css): the sky and the manor are the far layer, the platform and the detective the near
       one; the engine steams, the lamps burn, the detective's breath shows in the cold, the snow falls -->
  <g class="lf-far">
  <rect width="360" height="200" fill="url(#sky)"/>
  <!-- the manor far off on the hill -->
  <path d="M0 116 C80 104 150 110 220 98 C280 90 320 100 360 94 L360 130 L0 130Z" fill="#141a28"/>
  <g fill="#07090e"><rect x="262" y="84" width="30" height="12"/><path d="M258 86 L277 74 L296 86Z"/><rect x="274" y="68" width="5" height="10"/></g>
  <g fill="#ffc86b" filter="url(#glow)"><rect x="266" y="88" width="2" height="3"/><rect class="lf-flicker" style="--d:.8s" x="284" y="88" width="2" height="3"/></g>
  </g>
  <!-- steam -->
  <g fill="#c8d0e0" filter="url(#soft)">
    <circle cx="96" cy="70" r="18" opacity=".35"/><circle cx="120" cy="56" r="22" opacity=".3"/><circle cx="150" cy="48" r="20" opacity=".22"/>
    <circle cx="180" cy="46" r="16" opacity=".15"/>
  </g>
  <g data-fx="steam" data-at="92 60" data-r="20"/>
  <!-- the locomotive, facing us -->
  <rect x="44" y="96" width="92" height="56" fill="#07080c"/>
  <circle cx="90" cy="112" r="30" fill="#07080c"/>
  <rect x="84" y="70" width="12" height="20" fill="#07080c"/>
  <rect x="80" y="66" width="20" height="6" fill="#07080c"/>
  <circle cx="90" cy="112" r="24" fill="url(#lamp)"/>
  <circle cx="90" cy="112" r="7" fill="#fff6dc" filter="url(#glow)"/>
  <g data-fx="glow" data-at="90 112" data-r="38" data-tone="lamp"/>
  <path d="M40 152 L140 152 L150 160 L30 160Z" fill="#07080c"/>
  <g class="lf-near">
  <!-- platform, lamp post, sign -->
  <path d="M150 160 L360 146 L360 200 L120 200Z" fill="#1c2232"/>
  <path d="M150 160 L360 146" stroke="#dfe6f2" stroke-opacity=".5" stroke-width="1.5"/>
  <rect x="318" y="60" width="4" height="90" fill="#07080c"/>
  <path d="M312 56 L328 56 L324 66 L316 66Z" fill="#07080c"/>
  <circle cx="320" cy="62" r="16" fill="#ffd890" opacity=".25" filter="url(#soft)"/>
  <circle cx="320" cy="62" r="2.5" fill="#ffe8b0" filter="url(#glow)"/>
  <g data-fx="glow" data-at="320 62" data-r="24" data-tone="gas"/>
  <rect x="186" y="112" width="78" height="14" fill="#e8dcc0"/>
  <text x="225" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="7" letter-spacing=".4" fill="#2b2118">RAVENHILL HALT</text>
  <rect x="194" y="126" width="3" height="28" fill="#07080c"/><rect x="253" y="126" width="3" height="28" fill="#07080c"/>
  <!-- the detective: coat, hat, suitcase -->
  <path d="M268 190 L270 150 C270 140 290 140 290 150 L292 190Z" fill="#050608"/>
  <circle cx="280" cy="136" r="7" fill="#050608"/>
  <path d="M268 132 L292 132 L288 128 L284 122 L276 122 L272 128Z" fill="#050608"/>
  <rect x="292" y="166" width="16" height="14" rx="1.5" fill="#050608"/>
  <path d="M296 166 Q300 160 304 166" fill="none" stroke="#050608" stroke-width="1.5"/>
  <g data-fx="breath" data-at="291 136" data-r="7"/>
  <!-- snow -->
  <g fill="#e8eef8">
    <circle cx="30" cy="30" r="1.1" opacity=".7"/><circle cx="170" cy="20" r="1" opacity=".6"/><circle cx="220" cy="60" r="1.2" opacity=".6"/>
    <circle cx="250" cy="30" r=".9" opacity=".5"/><circle cx="340" cy="30" r="1.2" opacity=".7"/><circle cx="200" cy="88" r="1" opacity=".5"/>
    <circle cx="300" cy="110" r="1.3" opacity=".6"/><circle cx="160" cy="130" r="1.1" opacity=".5"/><circle cx="240" cy="176" r="1.2" opacity=".6"/>
    <circle cx="340" cy="170" r="1" opacity=".5"/><circle cx="20" cy="180" r="1.3" opacity=".6"/><circle cx="130" cy="30" r=".9" opacity=".5"/>
  </g>
  <g data-fx="snow"/>
  </g>
  <rect width="360" height="200" fill="url(#vig)"/>
</svg>
