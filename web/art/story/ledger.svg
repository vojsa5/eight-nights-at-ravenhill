<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
  <title>Lord Edmund at his desk over the ledgers; someone watches from the door</title>
  <defs>
    <radialGradient id="bg" cx="45%" cy="45%" r="80%">
      <stop offset="0" stop-color="#3a3020"/>
      <stop offset="1" stop-color="#060504"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".85"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8f0b8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#d8f0b8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="360" height="200" fill="url(#bg)"/>
  <!-- the door behind him, ajar, with someone in the gap -->
  <rect x="268" y="30" width="58" height="134" fill="#0c0a07"/>
  <!-- in the films (css/film.css) the lf-* parts move: the light from the passage, the watcher, the lamp, a page -->
  <g class="lf-flicker" style="--d:1.1s"><rect x="268" y="30" width="12" height="134" fill="#e8b860" opacity=".22"/></g>
  <g class="lf-lurk">
    <circle cx="276" cy="78" r="7" fill="#050403"/>
    <path d="M269 84 Q276 92 283 86 L283 164 L269 164Z" fill="#050403"/>
    <g class="lf-blink">
      <circle cx="274" cy="77" r="1" fill="#ffe2a0" filter="url(#glow)"/>
      <circle cx="278.5" cy="77" r="1" fill="#ffe2a0" filter="url(#glow)"/>
    </g>
  </g>
  <path d="M268 30 L262 34 L262 164 L268 164Z" fill="#2a2216"/>
  <!-- lamp and its light -->
  <path class="lf-hum" d="M150 74 L118 150 L226 150 L194 74Z" fill="url(#beam)"/>
  <path d="M158 62 Q172 52 186 62 L194 76 L150 76Z" fill="#2f5a2e"/>
  <rect x="170" y="76" width="4" height="30" fill="#b89a5a"/>
  <g data-fx="motes" data-at="172 116" data-r="30"/>
  <!-- Lord Edmund: seated, bent over the ledger -->
  <path d="M40 150 C38 116 52 96 76 92 C98 90 112 102 116 124 L120 150Z" fill="#0a0806"/>
  <circle cx="90" cy="80" r="14" fill="#0a0806"/>
  <path d="M100 84 C104 86 106 90 104 93 L98 92Z" fill="#0a0806"/>
  <path d="M106 108 C118 118 126 128 136 140" fill="none" stroke="#0a0806" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="139" cy="142" rx="6" ry="4" fill="#0a0806"/>
  <!-- desk -->
  <rect x="20" y="148" width="320" height="8" fill="#2a1c10"/>
  <rect x="20" y="156" width="320" height="44" fill="#140d07"/>
  <!-- open ledger with red entries -->
  <path d="M128 146 L172 138 L172 150 L128 150Z" fill="#e8dcc0"/>
  <g stroke="#6a5a44" stroke-width=".8" opacity=".7">
    <path d="M134 144 L166 139 M134 146.5 L166 141.5"/>
  </g>
  <path d="M136 148.5 L164 144" stroke="#b3221b" stroke-width="1.4"/>
  <!-- the right-hand page, which stirs in the draught from the door -->
  <g class="lf-page" style="transform-box:view-box;transform-origin:172px 150px">
    <path d="M172 138 L216 146 L216 150 L172 150Z" fill="#d8ccb0"/>
    <path d="M178 140 L210 145 M178 142.5 L210 147.5" stroke="#6a5a44" stroke-width=".8" opacity=".7"/>
    <path d="M180 145 L204 148.8" stroke="#b3221b" stroke-width="1.4"/>
  </g>
  <!-- letters and coins -->
  <rect x="228" y="140" width="26" height="8" fill="#c8b890" transform="rotate(-6 241 144)"/>
  <rect x="232" y="136" width="26" height="8" fill="#d8c8a0" transform="rotate(4 245 140)"/>
  <g fill="#c8a040" filter="url(#glow)">
    <ellipse cx="112" cy="148" rx="5" ry="1.6"/>
    <ellipse cx="104" cy="148" rx="5" ry="1.6" opacity=".7"/>
  </g>
  <circle class="lf-glint" style="--d:3s" cx="114" cy="147.4" r="1.2" fill="#fff4cc" opacity="0"/>
  <rect width="360" height="200" fill="url(#vig)"/>
</svg>
