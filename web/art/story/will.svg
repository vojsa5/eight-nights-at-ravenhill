<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
  <title>The new will and the letter to Scotland Yard, beside the open safe</title>
  <defs>
    <radialGradient id="bg" cx="40%" cy="50%" r="80%">
      <stop offset="0" stop-color="#4a3418"/>
      <stop offset="1" stop-color="#070503"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".85"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffcf80" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffcf80" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="360" height="200" fill="url(#bg)"/>
  <!-- the wall safe, open -->
  <rect x="236" y="38" width="86" height="80" rx="4" fill="#1a1a1c" stroke="#3a3a3e" stroke-width="3"/>
  <rect x="246" y="48" width="66" height="60" fill="#070708"/>
  <path d="M236 38 L206 28 L206 128 L236 118Z" fill="#26262a" stroke="#3a3a3e" stroke-width="2"/>
  <circle cx="220" cy="78" r="9" fill="#141416" stroke="#8a7a50" stroke-width="2"/>
  <path d="M220 70 L220 74" stroke="#c8b070" stroke-width="1.5"/>
  <circle class="lf-glint" style="--d:2.6s" cx="214.5" cy="73" r="1.3" fill="#fff0c0" opacity="0"/>
  <path class="lf-firelit" d="M206 29 V127" stroke="#ff9a4a" stroke-opacity=".3" stroke-width="1.4"/>
  <!-- desk and lamplight -->
  <rect x="0" y="136" width="360" height="64" fill="#1a1109"/>
  <ellipse cx="140" cy="150" rx="130" ry="30" fill="url(#pool)"/>
  <!-- in the films (css/film.css): the lamplight breathes, dust turns in it, the fire he reads it by flickers from the
       left and lights the safe's edge, the wax, the nib and the dial catch the light -->
  <g data-fx="glow" data-at="140 150" data-r="130" data-ry="36" data-tone="lamp"/>
  <g data-fx="glow" data-at="0 150" data-r="120" data-ry="90" data-tone="fire"/>
  <path class="lf-firelit" d="M0 136 H120 L40 200 H0Z" fill="#ff8a3a" fill-opacity=".1"/>
  <g data-fx="motes" data-at="150 104" data-r="48"/>
  <!-- the will -->
  <g transform="rotate(-4 110 150)">
    <rect x="62" y="122" width="96" height="48" fill="#efe4c8"/>
    <text x="110" y="136" text-anchor="middle" font-family="Georgia, serif" font-size="8" font-style="italic" fill="#3a2a18">Last Will &amp; Testament</text>
    <g stroke="#8a7658" stroke-width=".8"><path d="M72 144 L148 144 M72 150 L148 150 M72 156 L130 156"/></g>
    <circle cx="140" cy="160" r="6" fill="#9e1b1b" filter="url(#glow)"/>
    <ellipse class="lf-glint" style="--d:1.2s" cx="138" cy="157.8" rx="2" ry="1.2" fill="#ffd8c8" opacity="0"/>
    <path d="M136 166 L134 172 M144 166 L146 172" stroke="#9e1b1b" stroke-width="2"/>
  </g>
  <!-- the letter to the Yard -->
  <g transform="rotate(7 206 156)">
    <rect x="170" y="140" width="72" height="34" fill="#dccca8"/>
    <path d="M170 140 L206 160 L242 140" fill="none" stroke="#9a8866" stroke-width="1"/>
    <text x="206" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="6.5" fill="#2b2118">New Scotland Yard</text>
  </g>
  <!-- fountain pen -->
  <path d="M44 190 L126 178 L127 182 L45 194Z" fill="#0c0c10"/>
  <path d="M126 178 L136 177 L127 182Z" fill="#c8a040"/>
  <circle class="lf-glint" style="--d:3.6s" cx="132" cy="178.6" r="1.1" fill="#fff4c8" opacity="0"/>
  <rect width="360" height="200" fill="url(#vig)"/>
</svg>
