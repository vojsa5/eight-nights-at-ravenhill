<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
  <title>Ravenhill Manor on the moor, snow beginning to fall</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e18"/>
      <stop offset=".7" stop-color="#27324c"/>
      <stop offset="1" stop-color="#3a4662"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e8ecf4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e8ecf4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".85"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="360" height="200" fill="url(#sky)"/>
  <circle cx="290" cy="46" r="46" fill="url(#moon)"/>
  <circle cx="290" cy="46" r="11" fill="#dfe5ef" opacity=".5"/>
  <path d="M230 40 C250 30 280 34 300 42 C320 36 345 40 360 48 L360 60 C330 56 300 60 270 56 C255 54 240 50 230 40Z" fill="#141a28" opacity=".85"/>
  <!-- moor -->
  <path d="M0 150 C60 138 110 142 160 136 C220 128 280 140 360 132 L360 200 L0 200Z" fill="#0d111c"/>
  <path d="M0 162 C80 154 150 160 220 152 C280 146 320 152 360 150 L360 200 L0 200Z" fill="#161c2a"/>
  <!-- the manor -->
  <g fill="#07090e">
    <rect x="118" y="96" width="124" height="46"/>
    <path d="M112 98 L180 70 L248 98Z"/>
    <rect x="96" y="104" width="30" height="38"/>
    <path d="M92 106 L111 88 L130 106Z"/>
    <rect x="234" y="104" width="30" height="38"/>
    <path d="M230 106 L249 88 L268 106Z"/>
    <rect x="170" y="54" width="20" height="44"/>
    <path d="M166 56 L180 40 L194 56Z"/>
    <rect x="136" y="72" width="7" height="18"/>
    <rect x="216" y="72" width="7" height="18"/>
    <rect x="100" y="90" width="5" height="10"/>
    <rect x="255" y="90" width="5" height="10"/>
  </g>
  <g fill="#ffc86b" filter="url(#glow)">
    <rect x="128" y="108" width="6" height="9"/>
    <rect x="144" y="108" width="6" height="9"/>
    <rect x="160" y="108" width="6" height="9" opacity=".35"/>
    <rect x="194" y="108" width="6" height="9"/>
    <rect x="210" y="108" width="6" height="9" opacity=".35"/>
    <rect x="226" y="108" width="6" height="9"/>
    <rect x="128" y="124" width="6" height="9" opacity=".35"/>
    <rect x="144" y="124" width="6" height="9"/>
    <rect x="210" y="124" width="6" height="9"/>
    <rect x="226" y="124" width="6" height="9" opacity=".35"/>
    <rect x="176" y="64" width="8" height="10"/>
    <rect x="104" y="116" width="6" height="8"/>
    <rect x="250" y="116" width="6" height="8" opacity=".35"/>
    <path d="M173 142 L173 124 Q180 116 187 124 L187 142Z"/>
  </g>
  <path d="M168 142 L192 142 L230 200 L130 200Z" fill="#ffc86b" opacity=".08"/>
  <!-- bare trees -->
  <g stroke="#06080c" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M40 150 L42 108 M42 124 L30 110 M42 118 L54 104 M41 132 L28 124 M42 112 L38 100"/>
    <path d="M318 146 L316 112 M316 126 L328 114 M316 120 L306 108 M317 134 L330 128"/>
  </g>
  <!-- snow -->
  <g fill="#e8eef8">
    <circle cx="20" cy="30" r="1.1" opacity=".7"/><circle cx="58" cy="62" r=".9" opacity=".5"/><circle cx="88" cy="18" r="1.2" opacity=".6"/>
    <circle cx="120" cy="44" r=".8" opacity=".5"/><circle cx="150" cy="24" r="1" opacity=".7"/><circle cx="206" cy="38" r="1.2" opacity=".6"/>
    <circle cx="232" cy="80" r=".9" opacity=".5"/><circle cx="262" cy="20" r="1" opacity=".6"/><circle cx="336" cy="84" r="1.2" opacity=".6"/>
    <circle cx="34" cy="96" r="1" opacity=".5"/><circle cx="76" cy="120" r="1.3" opacity=".7"/><circle cx="104" cy="70" r=".9" opacity=".5"/>
    <circle cx="198" cy="16" r=".8" opacity=".6"/><circle cx="280" cy="104" r="1.1" opacity=".6"/><circle cx="312" cy="66" r=".9" opacity=".5"/>
    <circle cx="352" cy="120" r="1" opacity=".6"/><circle cx="12" cy="128" r="1.2" opacity=".6"/><circle cx="160" cy="168" r="1.3" opacity=".6"/>
    <circle cx="246" cy="172" r="1" opacity=".5"/><circle cx="300" cy="178" r="1.2" opacity=".6"/><circle cx="60" cy="176" r="1" opacity=".5"/>
  </g>
  <rect width="360" height="200" fill="url(#vig)"/>
</svg>
