<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
  <title>The morning room at dawn: pale winter light at the tall window, two armchairs by a steaming teapot, and the door ajar onto a warm corridor</title>
  <defs>
    <radialGradient id="bg" cx="46%" cy="42%" r="80%">
      <stop offset="0" stop-color="#46506a"/>
      <stop offset="1" stop-color="#07080c"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".8"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a9cc4"/>
      <stop offset=".62" stop-color="#e8c8b8"/>
      <stop offset=".7" stop-color="#f4dcc0"/>
      <stop offset="1" stop-color="#e8eef8"/>
    </linearGradient>
    <linearGradient id="hall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd890"/>
      <stop offset="1" stop-color="#c8742a"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="pane"><rect x="130" y="22" width="64" height="112"/></clipPath>
    <!-- the dawn light, which grows in the films, drawn soft with these rather than blurred (a blur under a part that
         changes would be redrawn every frame) -->
    <radialGradient id="dawn">
      <stop offset="0" stop-color="#c8d8f4" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#c8d8f4" stop-opacity=".218"/>
      <stop offset=".6" stop-color="#c8d8f4" stop-opacity=".196"/>
      <stop offset=".7" stop-color="#c8d8f4" stop-opacity=".125"/>
      <stop offset=".8" stop-color="#c8d8f4" stop-opacity=".04"/>
      <stop offset=".9" stop-color="#c8d8f4" stop-opacity=".005"/>
      <stop offset="1" stop-color="#c8d8f4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="daylight">
      <stop offset="0" stop-color="#dfe8fa" stop-opacity=".155"/>
      <stop offset=".35" stop-color="#dfe8fa" stop-opacity=".15"/>
      <stop offset=".55" stop-color="#dfe8fa" stop-opacity=".12"/>
      <stop offset=".7" stop-color="#dfe8fa" stop-opacity=".075"/>
      <stop offset=".85" stop-color="#dfe8fa" stop-opacity=".025"/>
      <stop offset="1" stop-color="#dfe8fa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="200" fill="url(#bg)"/>
  <!-- the tall window, dawn over the snow -->
  <!-- in the films (css/verdict.css, film.css): the dawn grows at the window and on the floor, a few last flakes drift
       past the glass, the curtains stir, the door sways in the draught from the warm corridor, the teapot steams and
       dust turns in the window's light -->
  <circle class="lf-dawn" cx="162" cy="84" r="97" fill="url(#dawn)"/>
  <rect x="130" y="22" width="64" height="112" fill="url(#sky)"/>
  <path d="M130 106 C146 100 160 104 172 99 C182 96 188 100 194 98 L194 134 H130Z" fill="#f4f8ff"/>
  <path d="M130 106 Q133 100 136 104 Q139 98 143 103 Q146 100 149 103 L150 106Z M176 100 Q179 94 183 98 Q186 92 190 97 Q192 94 194 96 V100Z" fill="#6a7290" opacity=".75"/>
  <g clip-path="url(#pane)">
    <g class="lf-fall">
      <g id="flakes" fill="#f4f6fc" fill-opacity=".8">
        <circle cx="138" cy="30" r=".9"/><circle cx="154" cy="52" r="1.1"/><circle cx="176" cy="36" r=".8"/><circle cx="188" cy="70" r="1"/>
        <circle cx="142" cy="84" r="1"/><circle cx="168" cy="100" r=".8"/><circle cx="184" cy="122" r="1.1"/><circle cx="148" cy="118" r=".8"/>
      </g>
      <use href="#flakes" y="-112"/>
    </g>
  </g>
  <path d="M162 22 V134 M130 59 H194 M130 97 H194" stroke="#14151c" stroke-width="3"/>
  <rect x="128" y="20" width="68" height="116" fill="none" stroke="#14151c" stroke-width="4"/>
  <rect x="124" y="134" width="76" height="5" fill="#1e1e28"/>
  <path class="lf-stir" d="M112 14 C118 50 116 110 120 150 L130 150 C127 100 130 40 132 14Z" fill="#1a1622"/>
  <path class="lf-stir" style="--d:-3.4s" d="M212 14 C206 50 208 110 204 150 L194 150 C197 100 194 40 192 14Z" fill="#1a1622"/>
  <!-- pale light falling across the floor -->
  <ellipse class="lf-dawn" cx="178" cy="168" rx="78" ry="44" fill="url(#daylight)"/>
  <!-- the door ajar onto the warm corridor -->
  <rect x="264" y="48" width="36" height="126" fill="#16121a"/>
  <rect x="268" y="52" width="28" height="122" fill="url(#hall)"/>
  <g class="lf-ajar">
    <path d="M280 44 L300 52 L300 174 L280 182Z" fill="#221a1e"/>
    <path d="M283 60 L297 64 M283 100 L297 102 M283 140 L297 140" stroke="#342830" stroke-width="1"/>
    <circle cx="284" cy="116" r="1.6" fill="#c8a060"/>
  </g>
  <path d="M268 174 L280 182 L236 200 L180 200Z" fill="#ffb860" opacity=".22" filter="url(#soft)"/>
  <circle cx="274" cy="110" r="30" fill="#ffc070" opacity=".22" filter="url(#soft)"/>
  <!-- floor and rug -->
  <rect x="0" y="172" width="360" height="28" fill="#15141c"/>
  <ellipse cx="170" cy="182" rx="92" ry="11" fill="#2a2030" opacity=".8"/>
  <!-- two armchairs, silhouetted against the window -->
  <g fill="#0c0b10">
    <path d="M80 176 L80 120 C80 106 90 100 104 100 L116 100 C130 100 136 108 136 120 L136 176Z"/>
    <path d="M72 144 C72 132 90 132 90 144 L90 176 L72 176Z"/>
    <path d="M128 144 C128 132 146 132 146 144 L146 176 L128 176Z"/>
    <path d="M204 176 L204 120 C204 108 210 100 224 100 L236 100 C250 100 260 106 260 120 L260 176Z"/>
    <path d="M196 144 C196 132 214 132 214 144 L214 176 L196 176Z"/>
    <path d="M252 144 C252 132 270 132 270 144 L270 176 L252 176Z"/>
  </g>
  <path d="M136 120 C136 108 130 100 116 100" fill="none" stroke="#c8d8f4" stroke-opacity=".35" stroke-width="1.6"/>
  <path d="M204 120 C204 108 210 100 224 100" fill="none" stroke="#c8d8f4" stroke-opacity=".35" stroke-width="1.6"/>
  <path d="M262 134 C266 136 270 140 270 146 V174" fill="none" stroke="#ffb860" stroke-opacity=".3" stroke-width="1.2"/>
  <!-- the low table, tray and teapot -->
  <rect x="146" y="156" width="52" height="4" fill="#1c1618"/>
  <path d="M150 160 V178 M194 160 V178" stroke="#141014" stroke-width="3"/>
  <ellipse cx="172" cy="155" rx="26" ry="4" fill="#8a8a98"/>
  <ellipse cx="172" cy="154" rx="23" ry="3" fill="#b4b6c4"/>
  <path d="M160 153 C156 140 164 134 172 134 C180 134 188 140 184 153Z" fill="#d8dce8" opacity=".85"/>
  <path d="M184 144 C190 142 192 138 194 134" fill="none" stroke="#d8dce8" stroke-opacity=".85" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M160 140 C152 140 152 150 160 150" fill="none" stroke="#d8dce8" stroke-opacity=".85" stroke-width="2"/>
  <ellipse cx="172" cy="134" rx="6" ry="2" fill="#b4b6c4"/>
  <circle cx="172" cy="131" r="1.6" fill="#b4b6c4"/>
  <ellipse class="lf-glint" style="--d:2.2s" cx="166" cy="140" rx="1.6" ry="1" fill="#fff" opacity="0"/>
  <path d="M188 150 H194 V153 H188Z M148 150 H154 V153 H148Z" fill="#d8dce8" opacity=".8"/>
  <path d="M194 130 C190 124 198 120 194 112 M197 128 C194 122 201 118 198 110" fill="none" stroke="#fff4e0" stroke-opacity=".5" stroke-width="1.2" filter="url(#glow)"/>
  <g data-fx="steam" data-at="195 128" data-r="6"/>
  <g data-fx="motes" data-at="166 122" data-r="40"/>
  <g data-fx="glow" data-at="282 112" data-r="32" data-tone="lamp"/>
  <rect width="360" height="200" fill="url(#vig)"/>
</svg>
