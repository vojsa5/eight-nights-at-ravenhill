<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" data-cut="black">
  <title>The great hall under the gallery at night: the guests stand back in a wide ring under the chandelier, leaving an empty pool of light in the middle</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="80%">
      <stop offset="0" stop-color="#3a281a"/>
      <stop offset="1" stop-color="#060403"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="48%" r="75%">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".88"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd08a" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffd08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd8a0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffd8a0" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c140e"/>
      <stop offset="1" stop-color="#0a0706"/>
    </linearGradient>
    <pattern id="tiles" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="translate(180 140) scale(1 .32) rotate(45)">
      <rect width="16" height="16" fill="#18110c"/>
      <rect width="8" height="8" fill="#2a1f16"/>
      <rect x="8" y="8" width="8" height="8" fill="#2a1f16"/>
    </pattern>
    <g id="baluster"><path d="M-1.6 0 h3.2 l-.6 2.5 c1.6 1.5 1.6 4.5 .3 6.5 l.3 6 h-2.4 l.3 -6 c-1.3 -2 -1.3 -5 .3 -6.5Z"/></g>
    <!-- the guests, feet at 0, about 100 high -->
    <g id="man"><circle cy="-91" r="6.5"/><path d="M-4 -84 H4 L5 -81 C12 -80 16 -77 17 -70 L19 -40 C19 -36 16 -35 15 -38 L14 -50 L12 -38 L11 -4 L12 0 H3 L2 -36 H-2 L-3 0 H-12 L-11 -4 L-12 -38 L-14 -50 L-15 -38 C-16 -35 -19 -36 -19 -40 L-17 -70 C-16 -77 -12 -80 -5 -81Z"/></g>
    <g id="gown"><path d="M-7 -85 C-7 -96 7 -96 7 -85 L7.5 -79 H-7.5Z"/><circle cy="-86" r="5.5"/><path d="M-3 -80 H3 C10 -78 13 -74 12 -66 L10 -52 C10 -46 8 -44 7 -40 C10 -26 14 -10 16 0 H-16 C-14 -10 -10 -26 -7 -40 C-8 -44 -10 -46 -10 -52 L-12 -66 C-13 -74 -10 -78 -3 -80Z"/></g>
    <g id="stout"><circle cy="-84" r="6.5"/><path d="M-4 -77 H4 L5 -75 C14 -74 18 -70 19 -62 C21 -52 21 -42 18 -34 L13 -30 L12 -2 L13 0 H3 L2 -28 H-2 L-3 0 H-13 L-12 -2 L-13 -30 L-18 -34 C-21 -42 -21 -52 -19 -62 C-18 -70 -14 -74 -5 -75Z"/></g>
    <g id="plume"><path d="M2 -92 C6 -102 12 -106 16 -104 C11 -102 7 -98 4 -91Z"/><circle cy="-88" r="5"/><path d="M-6 -88 C-6 -96 6 -96 6 -88 L6 -84 H-6Z"/><path d="M-2.5 -82 H2.5 C9 -80 11 -76 10 -68 L8 -50 C12 -30 13 -12 13 0 H-13 C-13 -12 -12 -30 -8 -50 L-10 -68 C-11 -76 -9 -80 -2.5 -82Z"/></g>
    <g id="tall"><circle cy="-97" r="6"/><path d="M-3.5 -90 H3.5 L4.5 -87 C11 -86 14 -83 14.5 -76 L15 -44 L12 -42 L10 -4 L11 0 H2.5 L2 -40 H-2 L-2.5 0 H-11 L-10 -4 L-12 -42 L-15 -44 L-14.5 -76 C-14 -83 -11 -86 -4.5 -87Z"/></g>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="360" height="200" fill="url(#bg)"/>
  <!-- the wall above the gallery, two dim portraits -->
  <rect width="360" height="36" fill="#140d08"/>
  <g fill="none" stroke="#6a5028" stroke-width="1.6" opacity=".6">
    <rect x="52" y="4" width="26" height="26"/><rect x="282" y="4" width="26" height="26"/>
  </g>
  <g fill="#0c0806" opacity=".9"><circle cx="65" cy="14" r="5"/><path d="M57 30 C57 21 73 21 73 30Z"/><circle cx="295" cy="14" r="5"/><path d="M287 30 C287 21 303 21 303 30Z"/></g>
  <!-- the gallery: its rail, balusters and floor -->
  <rect y="33" width="360" height="4" fill="#2c1d10"/>
  <path d="M0 33.5 H360" stroke="#a07840" stroke-opacity=".45" stroke-width=".8"/>
  <!-- more of the house watching from the gallery, leaning on the rail -->
  <g fill="#080605">
    <circle cx="92" cy="25" r="4.4"/><path d="M85 52 V36 C85 31 88 30 92 30 C96 30 99 31 99 36 V52Z"/>
    <circle cx="117" cy="26" r="4"/><path d="M110 52 V37 C110 32 113 31 117 31 C121 31 124 32 124 37 V52Z"/>
    <path d="M113 26 C113 20 121 20 121 26 L121.5 29 H112.5Z"/>
    <circle cx="247" cy="25" r="4.2"/><path d="M240 52 V36 C240 31 243 30 247 30 C251 30 254 31 254 36 V52Z"/>
    <circle cx="272" cy="26.5" r="4"/><path d="M265 52 V38 C265 33 268 31.5 272 31.5 C276 31.5 279 33 279 38 V52Z"/>
  </g>
  <g fill="none" stroke="#c89050" stroke-opacity=".5" stroke-width=".7">
    <path d="M95 21.5 A4.4 4.4 0 0 1 96.4 25.5 M120 22.8 A4 4 0 0 1 121 26 M243.6 21.8 A4.2 4.2 0 0 0 242.8 25.6 M268.6 23.4 A4 4 0 0 0 268 26.6"/>
  </g>
  <g fill="#120b07">
    <use href="#baluster" x="4" y="37"/><use href="#baluster" x="13" y="37"/><use href="#baluster" x="22" y="37"/><use href="#baluster" x="31" y="37"/>
    <use href="#baluster" x="40" y="37"/><use href="#baluster" x="49" y="37"/><use href="#baluster" x="58" y="37"/><use href="#baluster" x="67" y="37"/>
    <use href="#baluster" x="76" y="37"/><use href="#baluster" x="85" y="37"/><use href="#baluster" x="94" y="37"/><use href="#baluster" x="103" y="37"/>
    <use href="#baluster" x="112" y="37"/><use href="#baluster" x="121" y="37"/><use href="#baluster" x="130" y="37"/><use href="#baluster" x="139" y="37"/>
    <use href="#baluster" x="148" y="37"/><use href="#baluster" x="157" y="37"/><use href="#baluster" x="166" y="37"/><use href="#baluster" x="175" y="37"/>
    <use href="#baluster" x="184" y="37"/><use href="#baluster" x="193" y="37"/><use href="#baluster" x="202" y="37"/><use href="#baluster" x="211" y="37"/>
    <use href="#baluster" x="220" y="37"/><use href="#baluster" x="229" y="37"/><use href="#baluster" x="238" y="37"/><use href="#baluster" x="247" y="37"/>
    <use href="#baluster" x="256" y="37"/><use href="#baluster" x="265" y="37"/><use href="#baluster" x="274" y="37"/><use href="#baluster" x="283" y="37"/>
    <use href="#baluster" x="292" y="37"/><use href="#baluster" x="301" y="37"/><use href="#baluster" x="310" y="37"/><use href="#baluster" x="319" y="37"/>
    <use href="#baluster" x="328" y="37"/><use href="#baluster" x="337" y="37"/><use href="#baluster" x="346" y="37"/><use href="#baluster" x="355" y="37"/>
  </g>
  <rect y="52" width="360" height="12" fill="#1a110a"/>
  <path d="M0 52.5 H360 M0 63.5 H360" stroke="#7a5a30" stroke-opacity=".4" stroke-width=".8"/>
  <!-- under the gallery: the panelled back wall -->
  <rect y="64" width="360" height="76" fill="#1d140d"/>
  <rect y="64" width="360" height="8" fill="#000" opacity=".45"/>
  <g fill="none" stroke="#2e2116" stroke-width="1.2">
    <rect x="76" y="80" width="30" height="50"/><rect x="118" y="80" width="30" height="50"/><rect x="212" y="80" width="30" height="50"/><rect x="254" y="80" width="30" height="50"/>
  </g>
  <!-- the great doors behind the ring, shut -->
  <rect x="158" y="76" width="44" height="64" fill="#140d08"/>
  <path d="M180 76 V140" stroke="#060403" stroke-width="1.4"/>
  <path d="M158 76 H202" stroke="#6a4a24" stroke-opacity=".5"/>
  <!-- the long-case clock, its pendulum ticking -->
  <rect x="34" y="72" width="22" height="68" fill="#120c08"/>
  <circle cx="45" cy="84" r="7" fill="#c8b48a" opacity=".55"/>
  <path d="M45 84 V79.5 M45 84 L48 85.5" stroke="#1a120a" stroke-width=".9"/>
  <rect x="39" y="94" width="12" height="36" fill="#080504"/>
  <g class="lf-tick" style="transform-box:view-box;transform-origin:45px 95px">
    <path d="M45 95 V122" stroke="#8a6a3a" stroke-width=".8"/>
    <circle cx="45" cy="124" r="3.2" fill="#c89a48"/>
  </g>
  <!-- the fireplace, banked low -->
  <rect x="296" y="98" width="50" height="42" fill="#2a1c12"/>
  <rect x="290" y="94" width="62" height="5" fill="#3a281a"/>
  <path d="M304 140 V112 C304 104 338 104 338 112 V140Z" fill="#070403"/>
  <path class="lf-fire" d="M309 140 C310 130 316 126 315 118 C320 124 322 128 321 132 C324 126 327 122 327 118 C331 126 334 132 333 140Z" fill="#e8742a" opacity=".85"/>
  <path class="lf-firelit" d="M296 140 H346 L360 160 H280Z" fill="#ff8a3a" fill-opacity=".22"/>
  <g data-fx="glow" data-at="321 128" data-r="36" data-tone="fire"/>
  <!-- the light coming down from the chandelier into the middle of the ring -->
  <path d="M164 26 L196 26 L248 158 L112 158Z" fill="url(#cone)" filter="url(#soft)"/>
  <!-- the marble floor -->
  <rect y="140" width="360" height="60" fill="url(#tiles)"/>
  <rect y="140" width="360" height="60" fill="url(#floor)" opacity=".55"/>
  <path d="M0 140 H360" stroke="#5a4028" stroke-opacity=".5"/>
  <ellipse cx="180" cy="152" rx="70" ry="13" fill="url(#pool)"/>
  <g data-fx="motes" data-at="180 100" data-r="46"/>
  <!-- sconces on the pilasters -->
  <g fill="#3a2a18"><rect x="110" y="96" width="4" height="10"/><rect x="246" y="96" width="4" height="10"/></g>
  <g fill="#e8dcc0"><rect x="110.5" y="90" width="3" height="6"/><rect x="246.5" y="90" width="3" height="6"/></g>
  <path class="lf-flame" d="M112 84 C114 87 114 89 112 90 C110 89 110 87 112 84Z" fill="#ffd27a" filter="url(#glow)"/>
  <path class="lf-flame" style="--d:.6s" d="M248 84 C250 87 250 89 248 90 C246 89 246 87 248 84Z" fill="#ffd27a" filter="url(#glow)"/>
  <g data-fx="glow" data-at="112 88" data-r="16" data-tone="candle"/>
  <g data-fx="glow" data-at="248 88" data-r="16" data-tone="candle"/>
  <!-- the guests, a wide ring with the middle left empty; a rim of the light on the side that faces it -->
  <g fill="#b88048" opacity=".55">
    <use href="#man" transform="translate(146.6 150) scale(.5)"/>
    <use href="#gown" transform="translate(213.4 150) scale(-.5 .5)"/>
    <use href="#plume" transform="translate(124.8 158) scale(.64)"/>
    <use href="#tall" transform="translate(237.2 158) scale(-.62 .62)"/>
    <use href="#stout" transform="translate(99 168) scale(.78)"/>
    <use href="#gown" transform="translate(261 168) scale(-.76 .76)"/>
    <use href="#man" transform="translate(63.2 182) scale(.95)"/>
    <use href="#man" transform="translate(298.8 182) scale(-.95 .95)"/>
  </g>
  <g fill="#070505">
    <use href="#man" transform="translate(146 150) scale(.5)"/>
    <use href="#gown" transform="translate(214 150) scale(-.5 .5)"/>
    <g class="lf-lean" style="--d:2s"><use href="#plume" transform="translate(124 158) scale(.64)"/></g>
    <use href="#tall" transform="translate(238 158) scale(-.62 .62)"/>
    <use href="#stout" transform="translate(98 168) scale(.78)"/>
    <g class="lf-lean" style="--d:5.5s"><use href="#gown" transform="translate(262 168) scale(-.76 .76)"/></g>
    <use href="#man" transform="translate(62 182) scale(.95)"/>
    <use href="#man" transform="translate(300 182) scale(-.95 .95)"/>
  </g>
  <g class="lf-near" fill="#040303">
    <use href="#gown" transform="translate(20 212) scale(1.3)"/>
    <use href="#stout" transform="translate(344 212) scale(-1.3 1.3)"/>
  </g>
  <!-- the chandelier, swaying a little on its chain, its candles flickering and its drops catching the light -->
  <path d="M180 0 V12" stroke="#2a1e12" stroke-width="1.2"/>
  <g class="lf-swing" style="transform-box:view-box;transform-origin:180px 0">
    <circle cx="180" cy="24" r="26" fill="#ffc070" opacity=".2" filter="url(#soft)"/>
    <path d="M160 22 C164 30 196 30 200 22 M168 22 C170 27 190 27 192 22 M180 12 V30" fill="none" stroke="#6a5028" stroke-width="1.3"/>
    <g fill="#e8dcc0"><rect x="159" y="18" width="2" height="4"/><rect x="167" y="18" width="2" height="4"/><rect x="179" y="18" width="2" height="4"/><rect x="191" y="18" width="2" height="4"/><rect x="199" y="18" width="2" height="4"/></g>
    <g fill="#ffe0a0" filter="url(#glow)">
      <ellipse class="lf-flicker" cx="160" cy="16.5" rx="1" ry="1.8"/><ellipse class="lf-flicker" style="--d:.7s" cx="168" cy="16.5" rx="1" ry="1.8"/>
      <ellipse class="lf-flicker" style="--d:1.9s" cx="180" cy="16.5" rx="1" ry="1.8"/><ellipse class="lf-flicker" style="--d:1.2s" cx="192" cy="16.5" rx="1" ry="1.8"/>
      <ellipse class="lf-flicker" style="--d:2.6s" cx="200" cy="16.5" rx="1" ry="1.8"/>
    </g>
    <path class="lf-glint" style="--d:-1.3s" d="M172 30 L172.6 32.4 L175 33 L172.6 33.6 L172 36 L171.4 33.6 L169 33 L171.4 32.4Z" fill="#fff6dc" opacity="0"/>
    <path class="lf-glint" style="--d:-3.6s" d="M188 30 L188.6 32.4 L191 33 L188.6 33.6 L188 36 L187.4 33.6 L185 33 L187.4 32.4Z" fill="#fff6dc" opacity="0"/>
  </g>
  <g data-fx="glow" data-at="180 18" data-r="30" data-tone="lamp"/>
  <!-- where the accused stands: the film lays the guest's photograph here -->
  <g data-fx="guest" data-at="180 98"/>
  <rect width="360" height="200" fill="url(#vig)"/>
</svg>
