<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 136">
  <!-- the ground floor of Ravenhill, sketched in pencil on a folded sheet, the library marked in red -->
  <defs>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1e8d0"/><stop offset=".65" stop-color="#e5d8b6"/><stop offset="1" stop-color="#d6c69e"/>
    </linearGradient>
    <pattern id="grid" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M7 0 H0 V7" fill="none" stroke="#6a86a8" stroke-opacity=".22" stroke-width=".5"/>
    </pattern>
    <radialGradient id="tack" cx=".36" cy=".3" r=".75">
      <stop offset="0" stop-color="#fff5c8"/><stop offset=".3" stop-color="#e2bd62"/><stop offset=".65" stop-color="#a8822e"/><stop offset="1" stop-color="#4a3210"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="125%" height="130%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect x="12" y="12" width="156" height="116" fill="#000" opacity=".42" filter="url(#soft)"/>
  <rect x="7" y="6" width="156" height="116" fill="url(#sheet)"/>
  <rect x="7" y="6" width="156" height="116" fill="url(#grid)"/>
  <!-- the folds: a darker half and a crease each way -->
  <rect x="85" y="6" width="78" height="58" fill="#000" opacity=".045"/>
  <rect x="7" y="64" width="78" height="58" fill="#000" opacity=".03"/>
  <path d="M85 6 V122 M7 64 H163" stroke="#fff" stroke-opacity=".35" stroke-width="1"/>
  <path d="M86 6 V122 M7 65 H163" stroke="#6a5a3a" stroke-opacity=".18" stroke-width=".8"/>
  <!-- the plan -->
  <g fill="none" stroke="#3e3c44" stroke-opacity=".8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 28 H148 V106 H22 Z" stroke-width="2"/>
    <path d="M66 28 V60 M66 74 V106 M104 28 V52 M104 64 V106 M22 66 H40 M50 66 H66 M104 74 H148" stroke-width="1.4"/>
    <path d="M74 98 h22 M74 94 h22 M74 90 h22 M74 86 h22" stroke-width=".6" stroke-opacity=".6"/>
    <path d="M78 106 v6 h14 v-6" stroke-width="1.2"/>
  </g>
  <g fill="#3e3c44" fill-opacity=".85" font-family="Georgia, 'Times New Roman', serif" font-size="6.2" letter-spacing=".8" text-anchor="middle">
    <text x="44" y="49">LIBRARY</text>
    <text x="44" y="90">DINING</text>
    <text x="85" y="46">HALL</text>
    <text x="126" y="44">DRAWING</text>
    <text x="126" y="51">ROOM</text>
    <text x="126" y="93">STUDY</text>
  </g>
  <!-- the red mark over the library, and the way to it -->
  <g fill="none" stroke="#a3221b" stroke-linecap="round" stroke-opacity=".9">
    <path d="M38 55 l9 8 M47 55 l-9 8" stroke-width="2.2"/>
    <ellipse cx="42" cy="49" rx="17" ry="13" transform="rotate(-8 42 49)" stroke-width="1.1" stroke-dasharray="40 3 25 2 60"/>
    <path d="M85 112 C 84 96, 76 76, 60 66" stroke-width=".9" stroke-dasharray="2.5 2"/>
  </g>
  <!-- north -->
  <g stroke="#3e3c44" stroke-opacity=".7" fill="none" stroke-width=".9">
    <path d="M155 19 V9 M152 12 l3 -4 l3 4"/>
  </g>
  <text x="155" y="25" fill="#3e3c44" fill-opacity=".8" font-family="Georgia, serif" font-size="6" text-anchor="middle">N</text>
  <circle cx="85" cy="13" r="5.4" fill="#000" opacity=".42" transform="translate(1.8 2.4)" filter="url(#soft)"/>
  <circle cx="85" cy="13" r="5.4" fill="url(#tack)"/>
  <circle cx="85" cy="13" r="5.4" fill="none" stroke="#3a2808" stroke-opacity=".5" stroke-width=".6"/>
</svg>
