<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 116">
  <!-- the inspector's railway ticket, pinned to the cork: a card ticket, clipped by the guard -->
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9d3ae"/><stop offset=".6" stop-color="#b7c49a"/><stop offset="1" stop-color="#a5b188"/>
    </linearGradient>
    <radialGradient id="tack" cx=".36" cy=".3" r=".75">
      <stop offset="0" stop-color="#fff5c8"/><stop offset=".3" stop-color="#e2bd62"/><stop offset=".65" stop-color="#a8822e"/><stop offset="1" stop-color="#4a3210"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feGaussianBlur stdDeviation="3"/></filter>
    <mask id="clip">
      <rect width="200" height="116" fill="#fff"/>
      <circle cx="161" cy="84" r="4.2" fill="#000"/>
    </mask>
  </defs>
  <rect x="13" y="13" width="178" height="94" rx="5" fill="#000" opacity=".45" filter="url(#soft)" mask="url(#clip)"/>
  <g mask="url(#clip)">
    <rect x="8" y="7" width="178" height="94" rx="5" fill="url(#card)"/>
    <rect x="13" y="12" width="168" height="84" rx="3" fill="none" stroke="#2f4a32" stroke-opacity=".55" stroke-width="1"/>
    <path d="M44 12 V96 M150 12 V96" stroke="#2f4a32" stroke-opacity=".35" stroke-width=".8"/>
  </g>
  <g fill="#24382a" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="97" y="27" font-size="9" letter-spacing="2.2">L. N. E. R.</text>
    <text x="97" y="49" font-size="13" font-weight="700" letter-spacing=".8">KING'S CROSS</text>
    <text x="97" y="61" font-size="8" font-style="italic">to</text>
    <text x="97" y="78" font-size="16" font-weight="700" letter-spacing="1.4">YORK</text>
    <text x="97" y="92" font-size="6.5" letter-spacing="1.6">THIRD CLASS · SINGLE</text>
    <text x="29" y="54" font-size="11" font-weight="700" transform="rotate(-90 29 54)" letter-spacing="1.5">0417</text>
    <text x="167" y="40" font-size="13" font-weight="700">3<tspan font-size="8" dy="-4">rd</tspan></text>
    <text x="167" y="64" font-size="7">Fare</text>
    <text x="167" y="74" font-size="9" font-weight="700">23/6</text>
  </g>
  <circle cx="22" cy="17" r="5.5" fill="#000" opacity=".4" transform="translate(1.6 2.2)" filter="url(#soft)"/>
  <circle cx="22" cy="17" r="5.5" fill="url(#tack)"/>
  <circle cx="22" cy="17" r="5.5" fill="none" stroke="#3a2808" stroke-opacity=".5" stroke-width=".6"/>
</svg>
