<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 134">
  <!-- Hollis's telegram from the Yard (prologue.js), its message pasted on in strips of tape -->
  <defs>
    <linearGradient id="form" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe2c0"/><stop offset=".65" stop-color="#e3d2a8"/><stop offset="1" stop-color="#d4c094"/>
    </linearGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6e6"/><stop offset="1" stop-color="#ece3cb"/>
    </linearGradient>
    <radialGradient id="tack" cx=".36" cy=".3" r=".75">
      <stop offset="0" stop-color="#fff5c8"/><stop offset=".3" stop-color="#e2bd62"/><stop offset=".65" stop-color="#a8822e"/><stop offset="1" stop-color="#4a3210"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="125%" height="130%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect x="12" y="12" width="176" height="114" fill="#000" opacity=".42" filter="url(#soft)"/>
  <rect x="7" y="6" width="176" height="114" fill="url(#form)"/>
  <rect x="12" y="11" width="166" height="104" fill="none" stroke="#7a4a2a" stroke-opacity=".45" stroke-width=".8"/>
  <g fill="#6e3f22" fill-opacity=".85" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="95" y="27" font-size="8.6" font-weight="700" letter-spacing="1.5">POST OFFICE TELEGRAPHS</text>
    <text x="95" y="36" font-size="5.8" font-style="italic" letter-spacing=".8">Urgent · Ravenhill 23.48</text>
  </g>
  <path d="M20 40 H170" stroke="#7a4a2a" stroke-opacity=".5" stroke-width=".6"/>
  <g fill="#7a4a2a" fill-opacity=".55" font-family="Georgia, serif" font-size="5.2"><text x="20" y="50">To</text><text x="20" y="104">From</text></g>
  <path d="M30 50.5 H170 M34 104.5 H120" stroke="#7a4a2a" stroke-opacity=".35" stroke-width=".5" stroke-dasharray="1 1.4"/>
  <g transform="rotate(-.6 95 70)">
    <rect x="24" y="56" width="142" height="11" fill="url(#tape)" stroke="#000" stroke-opacity=".08"/>
    <rect x="30" y="71" width="118" height="11" fill="url(#tape)" stroke="#000" stroke-opacity=".08"/>
    <rect x="44" y="86" width="96" height="11" fill="url(#tape)" stroke="#000" stroke-opacity=".08"/>
  </g>
  <g fill="#2a2620" font-family="'Courier New', Courier, monospace" font-size="6.6" font-weight="700" letter-spacing=".4" text-anchor="middle" transform="rotate(-.6 95 70)">
    <text x="95" y="64" textLength="132" lengthAdjust="spacingAndGlyphs">TO THE INSPECTOR AT RAVENHILL MANOR STOP</text>
    <text x="89" y="79">ROADS CLOSED BY SNOW STOP</text>
    <text x="92" y="94">TRUST NO ONE STOP</text>
  </g>
  <text x="68" y="104" fill="#2a2620" fill-opacity=".8" font-family="'Courier New', Courier, monospace" font-size="6.4" font-weight="700" text-anchor="middle">HOLLIS YARD</text>
  <circle cx="150" cy="104" r="9" fill="none" stroke="#7a2a30" stroke-opacity=".55" stroke-width="1"/>
  <circle cx="150" cy="104" r="6.4" fill="none" stroke="#7a2a30" stroke-opacity=".4" stroke-width=".6"/>
  <text x="150" y="106" fill="#7a2a30" fill-opacity=".6" font-family="Georgia, serif" font-size="4.6" text-anchor="middle">DEC 24</text>
  <circle cx="95" cy="13" r="5.4" fill="#000" opacity=".42" transform="translate(1.8 2.4)" filter="url(#soft)"/>
  <circle cx="95" cy="13" r="5.4" fill="url(#tack)"/>
  <circle cx="95" cy="13" r="5.4" fill="none" stroke="#3a2808" stroke-opacity=".5" stroke-width=".6"/>
</svg>
