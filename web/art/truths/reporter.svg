      <path d="M69 116 q1.5 -1.6 3 0 t3 0 t3 0 t3 0 M85 116 h9 M69 120.5 q1.5 -1.6 3 0 t3 0 M83 120.5 h11 M69 125 q1.5 -1.6 3 0 t3 0 t3 0 M85 125 h9 M69 129.5 q1.5 -1.6 3 0 t3 0 t3 0 M84 129.5 h10"/>
    </g>
