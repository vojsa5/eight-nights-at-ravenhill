    <path d="M153 116 H218.1" stroke-width="4.4" stroke-dasharray="0 6.5"/>
    <path d="M150 122 H220.1" stroke-width="4.6" stroke-dasharray="0 7"/>
  </g>
  <rect x="168" y="126" width="36" height="2.4" rx="1.2" fill="#c8c0b0"/>
  <path d="M146 110 C150 104 156 102 162 104" fill="none" stroke="#ffd290" stroke-width=".7" opacity=".5"/>
  <circle class="lf-glint" style="--d:1.2s" cx="224" cy="80.5" r="1.1" fill="#fff8e6" opacity="0"/>
