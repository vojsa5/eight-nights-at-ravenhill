  <ellipse cx="282" cy="122" rx="40" ry="8" fill="#000" opacity=".4" filter="url(#soft)"/>
  <path d="M244 118 C250 112 266 110 282 110 C298 110 314 112 320 118 C314 124 298 126 282 126 C266 126 250 124 244 118Z" fill="#1c1814"/>
