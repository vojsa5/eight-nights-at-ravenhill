<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" data-cut="pull" data-cut-at="51% 30%">
  <title>By candlelight in a guest room at Ravenhill: a portable typewriter, a Yorkshire Post press card in a hat band and a notebook of names, and the story of the decade being typed</title>
  <defs>
    <radialGradient id="bg" cx="40%" cy="40%" r="80%">
      <stop offset="0" stop-color="#3a2a1a"/>
      <stop offset="1" stop-color="#060403"/>
    </radialGradient>
    <radialGradient id="vig" cx="48%" cy="45%" r="75%">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".86"/>
    </radialGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a44"/>
      <stop offset="1" stop-color="#4a5a78"/>
    </linearGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffc070" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ffc070" stop-opacity="0"/>
