  <ellipse cx="320" cy="132" rx="11" ry="3" fill="#3a3a40"/>
  <ellipse cx="320" cy="131.4" rx="8" ry="2" fill="#141416"/>
  <path d="M314 130.6 L330 128" stroke="#e8e0d0" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="330.4" cy="127.9" r="1" fill="#ff8a3a" filter="url(#glow)"/>
  <g data-fx="smoke" data-at="331 121" data-r="9"/>
  <g data-fx="guest" data-at="236 70"/>
  <rect width="360" height="200" fill="url(#vig)"/>
