<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
  <title>The case closed: a thick file tied with string and stamped in red, a cold cup of tea and a fountain pen, in low morning sun</title>
  <defs>
    <radialGradient id="bg" cx="75%" cy="30%" r="85%">
      <stop offset="0" stop-color="#5a3a1e"/>
      <stop offset="1" stop-color="#060403"/>
    </radialGradient>
    <radialGradient id="vig" cx="48%" cy="55%" r="75%">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".88"/>
    </radialGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4d8"/>
      <stop offset="1" stop-color="#f0b060"/>
    </linearGradient>
    <linearGradient id="sun" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd890" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffd890" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="360" height="200" fill="url(#bg)"/>
  <!-- in the films (css/film.css): the case file is stamped as the scene comes in, the low sun breathes and dust turns
       in its light, and the pen and the cup catch it -->
  <!-- the window and the low sun coming through -->
  <circle cx="290" cy="60" r="60" fill="#ffc070" opacity=".3" filter="url(#soft)"/>
  <g data-fx="glow" data-at="290 62" data-r="66" data-tone="lamp"/>
  <rect x="254" y="16" width="72" height="92" fill="url(#pane)"/>
  <path d="M290 16 V108 M254 46 H326 M254 77 H326" stroke="#140c06" stroke-width="3"/>
  <rect x="252" y="14" width="76" height="96" fill="none" stroke="#140c06" stroke-width="4"/>
  <path d="M254 108 L326 108 L150 200 L20 200Z" fill="url(#sun)" filter="url(#soft)"/>
  <!-- the desk -->
  <rect x="0" y="120" width="360" height="80" fill="#22140a"/>
  <path d="M0 120 H360" stroke="#ffc070" stroke-opacity=".35" stroke-width="1.2"/>
  <path d="M20 140 C90 138 150 142 230 139 M40 176 C120 172 200 178 300 174" stroke="#2e1c0e" stroke-width="1" fill="none"/>
  <path d="M262 120 L340 120 L220 200 L90 200Z" fill="#ffc070" opacity=".12"/>
  <g data-fx="motes" data-at="236 112" data-r="54"/>
  <!-- long shadows thrown to the left -->
  <g fill="#0a0503" opacity=".55">
    <path d="M110 150 L200 146 L150 170 L20 176Z"/>
    <path d="M232 146 L250 146 L180 162 L150 162Z"/>
    <path d="M150 178 L200 172 L130 184 L90 186Z"/>
  </g>
  <!-- the case file, thick with papers -->
  <g class="lf-pressed">
  <path d="M108 150 L218 144 L218 152 L108 159Z" fill="#d8c8a8"/>
  <path d="M108 153 L218 147 M108 156 L218 150" stroke="#8a7a60" stroke-width=".6"/>
  <path d="M112 120 L212 114 L218 144 L108 150Z" fill="#a8845a"/>
  <path d="M212 114 L218 144" stroke="#ffd890" stroke-opacity=".6" stroke-width="1.2"/>
  <path d="M110 136 L216 129 M166 117 L162 147" stroke="#e8dcc0" stroke-width="1.4" fill="none"/>
  <path d="M164 132 C156 126 152 134 164 133 C174 126 178 134 164 133 L158 142 M164 133 L170 141" fill="none" stroke="#e8dcc0" stroke-width="1.2"/>
  <g class="lf-stamped">
  <g transform="rotate(-8 190 126)" fill="none" stroke="#b81e1e" stroke-opacity=".85">
    <rect x="176" y="118" width="30" height="15" rx="2" stroke-width="1.6"/>
    <rect x="179" y="121" width="24" height="9" rx="1" stroke-width=".8"/>
    <path d="M182 125.5 H200" stroke-width="2.4" stroke-dasharray="4 1.5 7 1.5"/>
  </g>
  </g>
  <path d="M124 124 H148 M122 128 H140" stroke="#5a4028" stroke-width="1" stroke-linecap="round"/>
  </g>
  <!-- the fountain pen -->
  <g transform="rotate(-6 160 176)">
    <rect x="124" y="173" width="56" height="5" rx="2.5" fill="#0c0a0a"/>
    <path d="M180 173.5 L194 175.5 L180 177.5Z" fill="#c8a860"/>
    <circle class="lf-glint" style="--d:2.6s" cx="190" cy="175.2" r="1.1" fill="#fff4c8" opacity="0"/>
    <rect x="150" y="172.6" width="3" height="5.8" fill="#c8a860"/>
    <path d="M128 172.4 H148" stroke="#c8a860" stroke-width="1"/>
    <path d="M130 174 H176" stroke="#ffd890" stroke-opacity=".35" stroke-width=".8"/>
  </g>
  <!-- the cold cup of tea -->
  <ellipse cx="244" cy="146" rx="22" ry="5" fill="#b8b0a4"/>
  <ellipse cx="244" cy="145" rx="18" ry="3.6" fill="#d8d0c4"/>
  <path d="M230 128 C230 142 234 146 244 146 C254 146 258 142 258 128Z" fill="#e4dcd0"/>
  <path d="M258 131 C266 130 266 140 256 141" fill="none" stroke="#e4dcd0" stroke-width="2.2"/>
  <ellipse cx="244" cy="128" rx="14" ry="3" fill="#e4dcd0"/>
  <ellipse cx="244" cy="128.4" rx="12" ry="2.2" fill="#4a2c14"/>
  <ellipse cx="244" cy="128.4" rx="8" ry="1.2" fill="none" stroke="#7a5a3a" stroke-width=".6"/>
  <path d="M232 132 C233 140 236 144 242 145" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1"/>
  <ellipse class="lf-glint" style="--d:4.4s" cx="253" cy="128.6" rx="1.6" ry=".9" fill="#fffaf0" opacity="0"/>
  <rect width="360" height="200" fill="url(#vig)"/>
</svg>
