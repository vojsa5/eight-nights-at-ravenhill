    <path d="M50 -94.9 A8 8 0 0 1 50 -81.1 M45 -74 C47 -70 46 -66 45 -62 M59 -59.2 A3.8 3.8 0 0 1 60.6 -54.5 M54 -51 C57 -51 58.5 -49 58.5 -46" fill="none" stroke="#ff9a40" stroke-opacity=".6" stroke-width="1.2"/>
