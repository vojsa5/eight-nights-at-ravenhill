  <rect x="138" y="82" width="84" height="92" fill="#26160e"/>
  <path d="M154 174 V118 Q180 102 206 118 V174Z" fill="#060201" stroke="#ff9a40" stroke-opacity=".3" stroke-width="1.4"/>
  <ellipse cx="180" cy="168" rx="28" ry="10" fill="#ff7a24" opacity=".45" filter="url(#soft)"/>
  <path d="M164 172 C166 166 170 168 172 161 C175 166 178 158 181 154 C183 161 187 163 189 159 C192 165 194 168 196 172Z" fill="url(#fire)" filter="url(#glow)"/>
