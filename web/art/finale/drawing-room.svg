    <circle cx="278" cy="101" r="5.6"/><circle cx="291" cy="99" r="5.8"/><circle cx="303" cy="103" r="5.6"/>
    <path d="M269 176 V115 C269 108 287 108 287 115 V176Z M282 176 V113 C282 106 300 106 300 113 V176Z M294.5 176 V117 C294.5 110 311.5 110 311.5 117 V176Z"/>
  </g>
