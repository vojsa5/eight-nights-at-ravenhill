    <path d="M32 -95.9 A8 8 0 0 1 32 -82.1 M35 -75 C37 -70 37 -65 36 -60 M44 -56.6 L54 -58 C58 -58.6 60.5 -56 60 -53 M61 -52 L67 -24" fill="none" stroke="#ff9a40" stroke-opacity=".6" stroke-width="1.2"/>
