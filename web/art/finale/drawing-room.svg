    <use href="#ch"/>
    <path fill="#040305" d="M12 -44 C12 -62 20 -78 34 -79 C44 -79 47 -71 45 -62 L42 -44Z M20 -51 H54 C59 -51 59 -42 54 -42 H20Z M49 -46 L50 -3 C50 0 64 1 64 -2 C64 -5 58 -6 57 -6 L58 -46Z"/>
