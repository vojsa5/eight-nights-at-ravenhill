<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
  <title>The drawing room on the last evening: two guests face each other in high-backed armchairs before a low fire while the others crowd the doorway to listen</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="66%" r="80%">
      <stop offset="0" stop-color="#70361a"/>
      <stop offset=".45" stop-color="#2a181c"/>
      <stop offset="1" stop-color="#04050a"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="55%" r="75%">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".88"/>
    </radialGradient>
    <radialGradient id="fire" cx="50%" cy="85%" r="65%">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset=".5" stop-color="#ff7a24"/>
      <stop offset="1" stop-color="#8a2008" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aaccc"/>
      <stop offset="1" stop-color="#3c4866"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <path id="ch" fill="#170c08" d="M2 -30 L-2 -86 C-3 -94 12 -97 16 -89 L20 -30Z M14 -90 C24 -90 28 -80 26 -64 L18 -60Z M0 -12 V-42 H52 V-12Z M2 -12 H7 V0 H2Z M45 -12 H50 V0 H45Z"/>
    <path id="arm" fill="#170c08" d="M8 -42 V-52 C8 -58 40 -58 46 -54 C52 -51 51 -44 46 -42Z"/>
    <path id="rim" fill="none" stroke="#ff9a40" stroke-opacity=".3" d="M24 -86 C27 -80 27 -72 26 -64 M12 -57 C30 -58.5 40 -58 46 -54"/>
  </defs>
  <rect width="360" height="200" fill="url(#bg)"/>
