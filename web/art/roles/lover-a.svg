<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 262" width="200" height="262">
  <title>Lover (A): a gloved hand tips the poison vial into the brandy; half a heart on a chain</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0" stop-color="#6a1f3a"/>
      <stop offset="1" stop-color="#0e0408"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="72%">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".8"/>
    </radialGradient>
    <radialGradient id="brandy" cx="50%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffcf7a"/>
      <stop offset="1" stop-color="#a5521c"/>
    </radialGradient>
    <linearGradient id="poison" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4ff9a"/>
      <stop offset="1" stop-color="#5fc23e"/>
    </linearGradient>
    <filter id="halo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="262" fill="url(#bg)"/>
  <circle cx="44" cy="62" r="24" fill="#ffd0dc" opacity=".22" filter="url(#glow)"/>
