    <rect x="122" y="114" width="36" height="96" rx="1"/>
  </g>
  <rect x="174" y="-4" width="30" height="270" fill="#13050b"/>
  <rect x="160" y="-4" width="26" height="270" fill="#ffd6a8" opacity=".5" filter="url(#spill)"/>
  <rect x="167" y="-4" width="7" height="270" fill="url(#gap)" filter="url(#glow)"/>
  <g fill="#ff8fb0" opacity=".62" filter="url(#halo)">
