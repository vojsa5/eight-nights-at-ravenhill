    <path d="M100 56 C64 56 54 92 57 118 C59 140 48 156 30 172 C60 168 80 172 100 176 C120 172 140 168 170 172 C152 156 141 140 143 118 C146 92 136 56 100 56 Z"/>
    <path d="M134 172 C140 156 146 142 151 129 L163 131 C159 143 157 158 158 174 Z"/>
    <path d="M149 131 C149 120 153 109 159 105 L164 105 L164.5 128 C160 134 153 135 149 131 Z"/>
    <rect x="160" y="105.2" width="11.5" height="4.6" rx="2.3"/>
