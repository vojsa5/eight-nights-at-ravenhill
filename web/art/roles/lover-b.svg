<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 262" width="200" height="262">
  <title>Lover (B): a hand holds the library door ajar, keeping watch by the sliver of corridor light; the other half of the heart on a chain</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0" stop-color="#6a1f3a"/>
      <stop offset="1" stop-color="#0e0408"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="72%">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".8"/>
    </radialGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a0a16"/>
      <stop offset="1" stop-color="#3e1424"/>
    </linearGradient>
    <linearGradient id="gap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9cf"/>
      <stop offset="1" stop-color="#ffc08a"/>
    </linearGradient>
    <filter id="halo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="spill" x="-200%" y="-10%" width="500%" height="120%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect width="200" height="262" fill="url(#bg)"/>
  <rect x="112" y="-4" width="56" height="270" fill="url(#door)"/>
  <g fill="none" stroke="#ff8fb0" stroke-opacity=".16" stroke-width="1.2">
