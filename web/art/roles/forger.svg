  <path d="M133.4 198.8 C131.6 201.6 131.6 203.4 133.4 203.4 C135.2 203.4 135.2 201.6 133.4 198.8 Z" fill="#2a3f8a" stroke="#6a86d8" stroke-width=".5"/>
  <path d="M152 162 C150 153 157 147 165 148 C173 149 177 155 175 163 C174 169 169 173 163 172 C160 174 156 173 155 170 C152 169 151 166 152 162 Z" fill="#0b0a0f" stroke="#9fb4e0" stroke-width=".9" stroke-opacity=".5"/>
  <path d="M155 168 C153 172 156 176 160 173" fill="none" stroke="#0b0a0f" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M92 150 L100 178 L108 150 Z" fill="#e6c783" filter="url(#glow)"/>
  <rect width="200" height="262" fill="url(#vig)"/>
</svg>
