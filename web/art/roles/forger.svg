<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 262" width="200" height="262">
  <title>Forger: two identical wills, the real one and the forgery, under a pen nib dripping ink and inky fingerprints</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0" stop-color="#1c2a4a"/>
      <stop offset="1" stop-color="#03050b"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="72%">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".8"/>
    </radialGradient>
    <filter id="halo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <g id="will">
      <rect x="0" y="0" width="58" height="60" rx="1.5" fill="#efe2c0"/>
      <text x="29" y="11" font-size="7.4" font-style="italic" text-anchor="middle" fill="#3a2a18" font-family="Georgia, serif">Last Will</text>
      <path d="M8 21 q5 -3 10 0 t10 0 t10 0 t10 0 M8 29 q5 -3 10 0 t10 0 t10 0 t10 0 M8 37 q5 -3 10 0 t10 0 t10 0" fill="none" stroke="#6a5a40" stroke-width="1.2"/>
      <circle cx="46" cy="49" r="6" fill="#b3221b"/>
      <circle cx="46" cy="49" r="3" fill="#7a1010"/>
    </g>
  </defs>
  <rect width="200" height="262" fill="url(#bg)"/>
  <circle cx="100" cy="190" r="70" fill="#ffd9a0" opacity=".16" filter="url(#blur8)"/>
  <g fill="#9fb4e0" opacity=".62" filter="url(#halo)">
    <path d="M14 262 C18 204 52 176 100 172 C148 176 182 204 186 262 Z"/>
    <path d="M86 136 L86 180 L114 180 L114 136 Z"/>
