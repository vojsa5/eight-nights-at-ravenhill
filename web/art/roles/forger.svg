    <ellipse cx="104" cy="218" rx="1.7" ry="2.7" transform="rotate(12 104 218)"/>
  </g>
  <path d="M110 220 c4 -6 8 4 12 -2 s6 -4 10 0" fill="none" stroke="#1d2c66" stroke-width="1.6" stroke-linecap="round"/>
  <ellipse cx="133" cy="207" rx="4.4" ry="2.6" fill="#1d2c66"/>
  <circle cx="137.5" cy="205" r="1" fill="#1d2c66"/>
  <path d="M170 150 L140 190" stroke="#2a2018" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M140 190 L137.2 193.6" stroke="#c9a24a" stroke-width="3.4"/>
