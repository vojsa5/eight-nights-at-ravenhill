    <path d="M140 196 C146 182 152 172 156 162 L170 166 C166 178 160 190 156 200 Z"/>
    <ellipse cx="164" cy="160" rx="11" ry="10"/>
  </g>
  <g fill="#0b0a0f">
    <path d="M14 262 C18 204 52 176 100 172 C148 176 182 204 186 262 Z"/>
    <path d="M86 136 L86 180 L114 180 L114 136 Z"/>
    <ellipse cx="100" cy="108" rx="27" ry="33"/>
    <path d="M140 196 C146 182 152 172 156 162 L170 166 C166 178 160 190 156 200 Z"/>
  </g>
  <path d="M70 98 Q100 78 130 98 L126 104 Q100 88 74 104Z" fill="#3fa66a" opacity=".85" filter="url(#glow)"/>
  <circle cx="111" cy="114" r="6" fill="#bcd6ff" stroke="#e6c783" stroke-width="2" filter="url(#glow)"/>
  <g filter="url(#glow)">
    <use href="#will" transform="translate(36 172) rotate(-9 29 30)"/>
    <use href="#will" transform="translate(98 176) rotate(7 29 30)"/>
  </g>
  <g fill="#1d2c66" opacity=".75">
