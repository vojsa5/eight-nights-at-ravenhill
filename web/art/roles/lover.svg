<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 262" width="200" height="262">
  <title>Lovers: the two at the library door, the nightcap tray with the brandy between them, their two halves of the heart making one</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0" stop-color="#6a1f3a"/>
      <stop offset="1" stop-color="#0e0408"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="72%">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".8"/>
    </radialGradient>
    <radialGradient id="brandy" cx="50%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffcf7a"/>
      <stop offset="1" stop-color="#a5521c"/>
    </radialGradient>
    <linearGradient id="gap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9cf"/>
      <stop offset="1" stop-color="#ffc08a"/>
    </linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4dfe6"/>
      <stop offset="1" stop-color="#8a6a76"/>
    </linearGradient>
    <filter id="halo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="spill" x="-200%" y="-10%" width="500%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="200" height="262" fill="url(#bg)"/>
  <rect x="68" y="18" width="64" height="250" fill="#2e0c19"/>
  <path d="M64 268 V14 H136 V268" fill="none" stroke="#ff8fb0" stroke-opacity=".2" stroke-width="2.4"/>
  <g fill="none" stroke="#ff8fb0" stroke-opacity=".14" stroke-width="1.1">
    <rect x="74" y="26" width="20" height="60" rx="1"/>
    <rect x="106" y="26" width="20" height="60" rx="1"/>
  </g>
  <rect x="92" y="18" width="16" height="250" fill="#ffd6a8" opacity=".45" filter="url(#spill)"/>
  <rect x="98" y="18" width="4.5" height="250" fill="url(#gap)" filter="url(#glow)"/>
  <g transform="translate(-34 21) scale(.92)">
    <g fill="#ff8fb0" opacity=".62" filter="url(#halo)">
      <path d="M14 262 C18 204 52 176 100 172 C148 176 182 204 186 262 Z"/>
      <path d="M100 56 C64 56 54 92 57 118 C59 140 48 156 30 172 C60 168 80 172 100 176 C120 172 140 168 170 172 C152 156 141 140 143 118 C146 92 136 56 100 56 Z"/>
    </g>
    <g fill="#0b0a0f">
      <path d="M14 262 C18 204 52 176 100 172 C148 176 182 204 186 262 Z"/>
      <path d="M100 56 C64 56 54 92 57 118 C59 140 48 156 30 172 C60 168 80 172 100 176 C120 172 140 168 170 172 C152 156 141 140 143 118 C146 92 136 56 100 56 Z"/>
    </g>
    <ellipse cx="100" cy="116" rx="19" ry="25" fill="#000"/>
  </g>
  <g transform="translate(46 21) scale(.92)">
    <g fill="#ff8fb0" opacity=".62" filter="url(#halo)">
      <path d="M14 262 C18 204 52 176 100 172 C148 176 182 204 186 262 Z"/>
      <path d="M100 56 C64 56 54 92 57 118 C59 140 48 156 30 172 C60 168 80 172 100 176 C120 172 140 168 170 172 C152 156 141 140 143 118 C146 92 136 56 100 56 Z"/>
    </g>
    <g fill="#0b0a0f">
      <path d="M14 262 C18 204 52 176 100 172 C148 176 182 204 186 262 Z"/>
      <path d="M100 56 C64 56 54 92 57 118 C59 140 48 156 30 172 C60 168 80 172 100 176 C120 172 140 168 170 172 C152 156 141 140 143 118 C146 92 136 56 100 56 Z"/>
    </g>
    <ellipse cx="100" cy="116" rx="19" ry="25" fill="#000"/>
  </g>
  <path d="M60 150 Q74 176 96 172 M140 150 Q126 176 104 172" fill="none" stroke="#ff8fb0" stroke-width=".9" opacity=".5"/>
  <path d="M100 236 C80 220 74 204 86 196 C94 191 100 198 100 202 Z" transform="translate(99.4 164) scale(.68) translate(-100 -196)" fill="#ff5a7a" filter="url(#glow)"/>
  <path d="M100 202 C100 198 106 191 114 196 C126 204 120 220 100 236 Z" transform="translate(100.6 164) scale(.68) translate(-100 -196)" fill="#ff5a7a" filter="url(#glow)"/>
  <ellipse cx="100" cy="226" rx="30" ry="16" fill="#ffb060" opacity=".16" filter="url(#halo)"/>
  <ellipse cx="100" cy="238" rx="30" ry="6.5" fill="url(#tray)" opacity=".85"/>
  <ellipse cx="100" cy="236.6" rx="25" ry="4.6" fill="#3a2a30" opacity=".6"/>
  <g transform="translate(100 214)">
    <path d="M-10 2 C-13 10 -9 18 0 18 C9 18 13 10 10 2 Z" fill="url(#brandy)" filter="url(#soft)"/>
    <path d="M-8 -6 C-15 0 -14 15 0 18 C14 15 15 0 8 -6" fill="none" stroke="#ffe0ea" stroke-width="1" opacity=".75"/>
    <ellipse cx="0" cy="-6" rx="8" ry="1.8" fill="none" stroke="#ffe0ea" stroke-width=".9" opacity=".75"/>
    <path d="M0 18 V22 M-6 22.6 H6" stroke="#ffe0ea" stroke-width="1.4" opacity=".6"/>
  </g>
  <rect width="200" height="262" fill="url(#vig)"/>
</svg>
