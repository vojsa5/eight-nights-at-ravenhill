<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#140e0a">
<title>Eight Nights at Ravenhill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/folder.css">
<link rel="stylesheet" href="css/reveal.css">
<link rel="stylesheet" href="css/minisim.css">
<link rel="stylesheet" href="css/film.css">
<link rel="stylesheet" href="css/verdict.css">
<link rel="stylesheet" href="css/flashback.css">
<link rel="stylesheet" href="css/chapters.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/title.css">
<link rel="stylesheet" href="css/reading.css">
<link rel="stylesheet" href="css/tour.css">
</head>
<body>
<div class="title-screen" id="title" aria-hidden="true"></div>
<header class="casebar">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="13" cy="13" r="9" fill="none" stroke="#e6c783" stroke-width="3"/><path d="M20 20 L29 29" stroke="#e6c783" stroke-width="4" stroke-linecap="round"/></svg>
    <span>Eight Nights at Ravenhill</span>
  </div>
  <span class="stat">Night <span class="pips" id="pips"></span></span>
  <span class="stat">Score <b id="score">0</b></span>
  <span class="spacer"></span>
  <div class="case-actions">
  <button class="btn ghost" id="briefing" title="Watch how the case began, then how to play, Inspector Hollis's advice and the case papers">Story</button>
  <button class="btn ghost" id="howto" title="How the game works, as a short film">How to play</button>
  <button class="btn ghost" id="tips" title="Inspector Hollis's advice, one tip at a time">Advice</button>
  <button class="btn primary" id="newgame">New case</button>
  <button class="btn ghost" id="theme" title="Lamp light / daylight" aria-label="Toggle theme"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.7 A6.3 6.3 0 0 1 8 14.3Z" fill="currentColor"/></svg></button>
  </div>
</header>
<main class="desk" id="desk">
  <section class="board-wrap">
    <div class="props" aria-hidden="true"><span class="prop ring"></span><img class="prop glass" src="art/desk/magnifier.svg" alt="">
      <img class="prop watch" src="art/desk/watch.svg" alt=""><img class="prop letter" src="art/desk/letter.svg" alt=""></div>
    <div class="board" id="board"></div>
  </section>
  <aside class="folder" id="folder" aria-label="Case folder"><div class="folder-slide">
    <nav class="folder-tabs">
      <button data-tab="testimony" data-short="Ledger" aria-label="Testimony (ledger)">Testimony</button>
      <button data-tab="theory">Theory</button>
      <button data-tab="casefile" data-short="File" aria-label="Case file">Case file</button>
      <button data-tab="crimes">Crimes</button>
      <button data-tab="rewards" data-short="Books" aria-label="Rewards (books)">Rewards</button>
      <button data-tab="roles">Roles</button>
      <button data-tab="events">Events</button>
      <button data-tab="rules">Rules</button>
    </nav>
    <div class="folder-body">
      <div class="folder-head"><h2 id="folder-title"></h2><button class="tour-btn" id="tour-btn" hidden title="A short guided tour of this tab"
        aria-label="How this tab works: a short guided tour"><b aria-hidden="true">▶</b><span class="long" aria-hidden="true">How this tab works</span><span class="short" aria-hidden="true">How it works</span></button><button class="folder-close" id="folder-close" title="Close the folder" aria-label="Close the folder">×</button></div>
      <div class="tabbody" id="tabbody"></div>
    </div>
  </div></aside>
</main>
<div class="modal" id="modal"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
